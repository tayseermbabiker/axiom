[build]
  publish = "public"
  functions = "netlify/functions"

# ============================================================================
# Security headers
# ----------------------------------------------------------------------------
# Applied to every response from Netlify. Hardens the app against the most
# common browser-level attacks without changing application code.
#
# CSP notes:
#   - 'unsafe-inline' is required for script-src + style-src today because
#     the existing pages use inline onclick="..." event handlers and inline
#     <style>/style="" blocks throughout. Removing these is a Sprint 5+
#     refactor (replace inline handlers with addEventListener + nonces).
#     Even with 'unsafe-inline', this CSP still blocks the high-value
#     attacks:
#       - Loading scripts from attacker-controlled domains (script-src
#         restricts to self + jsdelivr + sentry CDN)
#       - Beaconing data to attacker domains (connect-src restricts to
#         self + Supabase + Stripe + Sentry)
#       - Loading plugins / Flash / Java (object-src 'none')
#       - Clickjacking via iframe embedding (frame-ancestors 'none')
#       - Form submission to attacker domains (form-action 'self')
#
#   - connect-src includes both https:// and wss:// for Supabase because
#     the JS client uses websockets for realtime subscriptions.
#   - frame-src allows js.stripe.com + hooks.stripe.com for Stripe Checkout.
#
# Other headers:
#   - X-Frame-Options + frame-ancestors: belt-and-suspenders clickjacking block
#   - X-Content-Type-Options: nosniff blocks MIME confusion
#   - Referrer-Policy: limits referrer leakage to third parties
#   - Strict-Transport-Security: hardens HTTPS (Netlify already serves HTTPS)
#   - Permissions-Policy: disables sensors / camera / mic by default
# ============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.ingest.sentry.io; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self 'https://js.stripe.com')"
