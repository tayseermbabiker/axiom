<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started — Audexon</title>
  <script>
    (function () {
      try {
        var lang = localStorage.getItem('audexon_lang');
        if (lang !== 'ar' && lang !== 'en') lang = 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/rtl.css">
  <!-- Sentry error tracking (no-op until window.SENTRY_DSN is set in sentry-init.js) -->
  <script src="https://browser.sentry-cdn.com/7.99.0/bundle.min.js" crossorigin="anonymous"></script>
  <script src="../js/sentry-init.js"></script>
</head>
<body>
  <div class="onboarding-container">
    <div class="onboarding-card">
      <h1 data-i18n="onboarding.welcome">Welcome to Audexon</h1>
      <p class="text-muted" data-i18n="onboarding.subtitle">Set up your firm to get started.</p>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <!-- Choice buttons -->
      <div id="choice-section">
        <div class="onboarding-options">
          <button class="onboarding-option" onclick="showCreateFirm()">
            <div class="onboarding-option-title" data-i18n="onboarding.createNewTitle">Create a new firm</div>
            <div class="onboarding-option-desc" data-i18n="onboarding.createNewDesc">You are starting a new organization on Audexon.</div>
          </button>
          <button class="onboarding-option" onclick="showPendingInvites()">
            <div class="onboarding-option-title" data-i18n="onboarding.invitedTitle">I was invited</div>
            <div class="onboarding-option-desc" data-i18n="onboarding.invitedDesc">Someone from your firm already sent you an invite.</div>
          </button>
        </div>
      </div>

      <!-- Create firm form -->
      <div id="create-firm-section" style="display:none;">
        <form id="form-create-firm">
          <div class="form-group">
            <label for="firm-name" data-i18n="onboarding.firmName">Firm Name</label>
            <input type="text" id="firm-name" class="form-control" placeholder="e.g. Smith & Associates CPAs" data-i18n-placeholder="onboarding.firmNamePh" required>
          </div>
          <div class="form-group">
            <label for="firm-country" data-i18n="onboarding.country">Country</label>
            <select id="firm-country" class="form-control" required>
              <option value="" data-i18n="onboarding.countrySelect">Select your country&hellip;</option>
              <option value="AE">United Arab Emirates</option>
              <option value="SA">Saudi Arabia</option>
              <option value="QA">Qatar</option>
              <option value="KW">Kuwait</option>
              <option value="OM">Oman</option>
              <option value="BH">Bahrain</option>
              <option value="EG">Egypt</option>
              <option value="JO">Jordan</option>
              <option value="LB">Lebanon</option>
              <option value="MA">Morocco</option>
              <option value="TN">Tunisia</option>
              <option value="DZ">Algeria</option>
              <option value="IQ">Iraq</option>
              <option value="SD">Sudan</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="access-code" data-i18n="onboarding.accessCode">Access Code</label>
            <input type="text" id="access-code" class="form-control" placeholder="Enter your access code" data-i18n-placeholder="onboarding.accessCodePh" required>
            <small style="color:var(--gray-500); font-size:11px; margin-top:4px; display:block;" data-i18n="onboarding.accessCodeHelp">Contact us to get an access code for your firm.</small>
          </div>
          <div id="code-error" class="error-msg" style="display:none;"></div>
          <div class="form-group" style="display:flex; align-items:flex-start; gap:8px; margin-top:4px;">
            <input type="checkbox" id="accept-terms" style="margin-top:3px; flex-shrink:0;">
            <label for="accept-terms" style="font-size:13px; color:var(--gray-600); font-weight:400; line-height:1.5;" data-i18n-html="onboarding.terms">
              I have read and agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
            </label>
          </div>
          <div class="flex gap-8">
            <button type="button" class="btn btn-outline" onclick="showChoice()" data-i18n="onboarding.back">Back</button>
            <button type="submit" class="btn btn-primary" id="btn-create-firm" data-i18n="onboarding.createFirm">Create Firm</button>
          </div>
        </form>
      </div>

      <!-- Pending invites -->
      <div id="invites-section" style="display:none;">
        <div id="invites-list">
          <div class="empty-state"><p>Checking for invites...</p></div>
        </div>
        <div class="mt-16">
          <button type="button" class="btn btn-outline" id="invites-back-btn" onclick="showChoice()" data-i18n="onboarding.back">Back</button>
        </div>
      </div>

      <div class="onboarding-footer">
        <div class="lang-seg" role="group" aria-label="Language / اللغة"><button type="button" class="lang-seg-btn seg-en" onclick="I18n.setLang('en')">EN</button><button type="button" class="lang-seg-btn seg-ar" onclick="I18n.setLang('ar')">ع</button></div>
        <button class="btn btn-outline btn-sm" onclick="signOutOnboarding()" data-i18n="nav.signOut">Sign out</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let currentUser = null;
    let hasInvites = false;

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = '/pages/login.html';
        return;
      }
      currentUser = session.user;

      // If user already has an org, go to dashboard
      const org = await getUserOrg();
      if (org) {
        window.location.href = '/pages/dashboard.html';
        return;
      }

      // Check if user has pending invites — if so, skip choice and show invites directly
      const { data: invites } = await supabaseClient
        .from('organization_invites')
        .select('id')
        .eq('email', currentUser.email)
        .eq('status', 'pending')
        .limit(1);

      if (invites && invites.length > 0) {
        // Hide the "Create a firm" option — invited users should only accept
        hasInvites = true;
        document.getElementById('choice-section').style.display = 'none';
        showPendingInvites();
      }
    }

    function showChoice() {
      document.getElementById('choice-section').style.display = 'block';
      document.getElementById('create-firm-section').style.display = 'none';
      document.getElementById('invites-section').style.display = 'none';
      hideMessages();
    }

    function showCreateFirm() {
      document.getElementById('choice-section').style.display = 'none';
      document.getElementById('create-firm-section').style.display = 'block';
      document.getElementById('invites-section').style.display = 'none';
      hideMessages();
      document.getElementById('firm-name').focus();
    }

    async function showPendingInvites() {
      document.getElementById('choice-section').style.display = 'none';
      document.getElementById('create-firm-section').style.display = 'none';
      document.getElementById('invites-section').style.display = 'block';
      // Hide back button if user was auto-directed (has pending invites)
      if (hasInvites) {
        document.getElementById('invites-back-btn').style.display = 'none';
      }
      hideMessages();

      const listEl = document.getElementById('invites-list');
      listEl.innerHTML = '<div class="empty-state"><p>Loading invites...</p></div>';

      const { data: invites, error } = await supabaseClient
        .from('organization_invites')
        .select('*, organizations(name)')
        .eq('email', currentUser.email)
        .eq('status', 'pending');

      if (error) {
        listEl.innerHTML = '<div class="empty-state"><p>Error loading invites.</p></div>';
        return;
      }

      if (!invites || invites.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><p>No pending invites found for ' + escHtml(currentUser.email) + '.</p></div>';
        return;
      }

      listEl.innerHTML = invites.map(inv => `
        <div class="invite-item">
          <div>
            <div class="invite-firm">${escHtml(inv.organizations?.name || 'Unknown Firm')}</div>
            <div class="text-sm text-muted">Role: <span class="role-badge role-${inv.role}">${inv.role}</span></div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="acceptInvite('${inv.id}', '${inv.organization_id}', '${inv.role}')">Accept</button>
        </div>
      `).join('');
    }

    // Access codes -> trial length + tier. Issued manually, per client.
    // NOTE: client-side gate (visible in page source) = SOFT gate only, until
    // the server-validated access_codes table ships. Edit here to rotate/revoke.
    const CODE_CONFIG = {
      'AUDEXON-VIP': { trialMonths: 3, featureTier: 'pro' },  // Sadig + Qatari partner
      'AUDEXON-1M':  { trialMonths: 1, featureTier: 'pro' },  // standard founding clients
    };

    // Create firm
    document.getElementById('form-create-firm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-create-firm');
      btn.disabled = true;
      btn.textContent = 'Creating...';
      hideMessages();

      const firmName = document.getElementById('firm-name').value.trim();
      const country = document.getElementById('firm-country').value;
      const accessCode = document.getElementById('access-code').value.trim().toUpperCase();

      if (!document.getElementById('accept-terms').checked) {
        const errEl = document.getElementById('code-error');
        errEl.textContent = 'Please accept the Terms of Service and Privacy Policy to continue.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Firm';
        return;
      }

      if (!country) {
        const errEl = document.getElementById('code-error');
        errEl.textContent = 'Please select your country.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Firm';
        return;
      }

      // Validate access code -> resolves trial length + tier
      const codeCfg = CODE_CONFIG[accessCode];
      if (!codeCfg) {
        const errEl = document.getElementById('code-error');
        errEl.textContent = 'Invalid access code. Contact us to get your code.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Firm';
        return;
      }

      try {
        // Create organization with trial length + tier from the access code
        const trialEnd = new Date();
        trialEnd.setMonth(trialEnd.getMonth() + codeCfg.trialMonths);

        const { data: org, error: orgErr } = await supabaseClient
          .from('organizations')
          .insert({
            name: firmName,
            country: country,
            created_by: currentUser.id,
            trial_expires_at: trialEnd.toISOString(),
            feature_tier: codeCfg.featureTier
          })
          .select()
          .single();

        if (orgErr) throw orgErr;

        // Add current user as admin
        const { error: memErr } = await supabaseClient
          .from('organization_members')
          .insert({
            organization_id: org.id,
            user_id: currentUser.id,
            role: 'admin'
          });

        if (memErr) throw memErr;

        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Create Firm';
      }
    });

    // Accept invite
    async function acceptInvite(inviteId, orgId, role) {
      hideMessages();

      try {
        // Add user to organization
        const { error: memErr } = await supabaseClient
          .from('organization_members')
          .insert({
            organization_id: orgId,
            user_id: currentUser.id,
            role: role
          });

        if (memErr) throw memErr;

        // Mark invite as accepted
        await supabaseClient
          .from('organization_invites')
          .update({ status: 'accepted' })
          .eq('id', inviteId);

        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        showError(err.message);
      }
    }

    function signOutOnboarding() {
      supabaseClient.auth.signOut();
      window.location.href = '/';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideMessages() {
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('success-msg').style.display = 'none';
    }

    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
