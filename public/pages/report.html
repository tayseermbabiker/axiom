<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit File — Audexon</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0D1626; line-height: 1.6; padding: 0; max-width: 900px; margin: 0 auto; font-size: 12px; }

    /* ---- Cover ---- */
    .cover { padding: 60px 48px 40px; margin-bottom: 0; page-break-after: always; text-align: center; }
    .cover-brand { font-size: 13px; font-weight: 700; color: #1A3A5F; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 48px; }
    .cover-divider { width: 60px; height: 3px; background: #1A3A5F; margin: 0 auto 40px; }
    .cover h1 { font-size: 32px; font-weight: 700; color: #1A1A2E; margin-bottom: 8px; }
    .cover-subtitle { font-size: 16px; color: #6b7280; margin-bottom: 48px; }
    .cover-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; text-align: left; max-width: 500px; margin: 0 auto 40px; font-size: 13px; }
    .cover-details dt { font-weight: 600; color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .cover-details dd { color: #1A1A2E; font-weight: 500; margin-bottom: 8px; }
    .cover-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 500px; margin: 0 auto; }
    .cover-metric { border: 1px solid #D9D9D9; border-radius: 8px; padding: 16px 8px; text-align: center; background: #F5F7FA; }
    .cover-metric .val { font-size: 22px; font-weight: 700; color: #1A3A5F; }
    .cover-metric .lbl { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; }
    .cover-footer { font-size: 10px; color: #9ca3af; margin-top: 48px; padding-top: 16px; border-top: 1px solid #D9D9D9; }

    /* ---- Page header/footer ---- */
    .page-hdr { font-size: 9px; color: #9ca3af; padding: 8px 0; margin-bottom: 20px; border-bottom: 1px solid #E5E7EB; display: flex; justify-content: space-between; }

    /* ---- Headings ---- */
    h2 { font-size: 16px; font-weight: 700; color: #1A3A5F; margin: 36px 0 16px; padding: 10px 0 8px; border-bottom: 2px solid #1A3A5F; page-break-after: avoid; text-transform: uppercase; letter-spacing: 0.5px; }
    h3 { font-size: 13px; font-weight: 700; margin: 20px 0 8px; color: #1A3A5F; page-break-after: avoid; }
    h4 { font-size: 11px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px; }

    /* ---- Tables ---- */
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 16px; border: 1px solid #D9D9D9; }
    th { text-align: left; padding: 8px 10px; font-weight: 700; color: #1A3A5F; font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; background: #F5F7FA; border-bottom: 2px solid #D9D9D9; }
    td { padding: 7px 10px; border-bottom: 1px solid #EBEBEB; vertical-align: top; }
    tr:nth-child(even) td { background: #FAFBFC; }

    /* ---- Badges ---- */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
    .b-approved { background: #D1FAE5; color: #065F46; }
    .b-open { background: #FEF3C7; color: #92400E; }
    .b-resolved { background: #D1FAE5; color: #065F46; }
    .b-reported { background: #DBEAFE; color: #1E40AF; }
    .b-high { background: #FEE2E2; color: #991B1B; }
    .b-medium { background: #FEF3C7; color: #92400E; }
    .b-low { background: #F3F4F6; color: #4B5563; }
    .b-done { background: #D1FAE5; color: #065F46; }
    .b-pending { background: #F3F4F6; color: #4B5563; }
    .b-interim { background: #E0E7FF; color: #3730A3; }
    .b-ml { background: #E0E7FF; color: #3730A3; }

    /* ---- Section workpaper ---- */
    .wp-section { margin-bottom: 24px; }
    .wp-header { background: #F5F7FA; border: 1px solid #D9D9D9; border-radius: 4px; padding: 14px 18px; margin-bottom: 16px; }
    .wp-title { font-size: 15px; font-weight: 700; color: #1A1A2E; }
    .wp-meta { font-size: 10px; color: #6b7280; margin-top: 4px; line-height: 1.5; }
    .wp-conclusion { background: #F0FDF4; border-left: 4px solid #059669; padding: 12px 16px; margin: 12px 0; font-size: 12px; color: #1A1A2E; }
    .wp-conclusion-label { font-size: 9px; font-weight: 700; color: #059669; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }

    /* ---- Procedures ---- */
    .proc-block { margin-bottom: 12px; padding: 10px 14px; background: #FAFBFC; border: 1px solid #EBEBEB; border-radius: 4px; }
    .proc-desc { font-weight: 600; font-size: 12px; color: #1A1A2E; margin-bottom: 4px; }
    .proc-meta { font-size: 10px; color: #6b7280; }
    .proc-response { font-size: 11px; margin-top: 6px; white-space: pre-wrap; color: #374151; line-height: 1.5; }
    .proc-response-label { font-size: 9px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }

    /* ---- Findings ---- */
    .finding-block { background: #FAFBFC; border: 1px solid #D9D9D9; border-left: 4px solid #1A3A5F; border-radius: 4px; padding: 12px 16px; margin-bottom: 12px; }
    .finding-title { font-weight: 700; font-size: 13px; color: #1A1A2E; }
    .finding-detail { font-size: 11px; color: #374151; margin-top: 4px; line-height: 1.5; }
    .finding-detail-label { font-size: 9px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }
    .adj-entry { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 4px; padding: 8px 12px; margin-top: 8px; font-size: 11px; }

    /* ---- Review notes ---- */
    .rn-item { font-size: 11px; margin-bottom: 8px; padding: 6px 0; border-bottom: 1px solid #EBEBEB; }
    .rn-meta { font-size: 9px; color: #9ca3af; font-weight: 600; }

    /* ---- Documents ---- */
    .doc-row { font-size: 11px; padding: 4px 0; }
    .doc-cat { font-size: 9px; color: white; background: #1A3A5F; padding: 1px 6px; border-radius: 2px; font-weight: 600; }

    .no-data { font-size: 11px; color: #9ca3af; font-style: italic; padding: 8px 0; }

    /* ---- Print bar ---- */
    .print-bar { display: flex; gap: 8px; padding: 16px 24px; background: #F5F7FA; border-bottom: 1px solid #D9D9D9; position: sticky; top: 0; z-index: 10; }
    .print-bar button, .print-bar select { padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; border: 1px solid #D9D9D9; font-family: inherit; }
    .btn-print { background: #1A3A5F; color: white; border-color: #1A3A5F; }
    .btn-back { background: white; color: #374151; }

    /* ---- Phase label ---- */
    .phase-divider { font-size: 11px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 1px; padding: 8px 0; margin: 24px 0 8px; border-bottom: 1px solid #D9D9D9; }

    /* ---- Print ---- */
    @media print {
      .print-bar { display: none; }
      body { padding: 24px; font-size: 10px; }
      .cover { page-break-after: always; min-height: auto; padding: 48px 40px; }
      .wp-header { page-break-inside: avoid; page-break-after: avoid; }
      .proc-block { page-break-inside: avoid; }
      .finding-block { page-break-inside: avoid; }
      h2 { page-break-after: avoid; }
      h4 { page-break-after: avoid; }
      .phase-divider { page-break-after: avoid; }
      .page-hdr { display: flex; }
    }

    @media screen {
      body { padding: 0 24px 40px; }
      .page-hdr { display: none; }
    }
  </style>
</head>
<body>
  <div class="print-bar">
    <select id="phase-filter" onchange="init()" style="padding:8px 12px; font-size:14px; border-radius:6px; border:1px solid #d1d5db;">
      <option value="all">All Phases</option>
      <option value="interim">Interim Only</option>
      <option value="final">Final Only</option>
    </select>
    <button class="btn-print" onclick="window.print()">Save as PDF</button>
    <button class="btn-back" onclick="window.close()">Close</button>
  </div>

  <div id="report-content">Loading...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const engagementId = new URLSearchParams(window.location.search).get('id');
    if (!engagementId) { document.body.innerHTML = '<p>No engagement ID.</p>'; }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = '/pages/login.html'; return; }
      const currentUser = session.user;
      const org = await getUserOrg();
      if (!org) { window.location.href = '/pages/onboarding.html'; return; }

      const { data: eng } = await supabaseClient.from('engagements').select('*').eq('id', engagementId).single();
      if (!eng || eng.organization_id !== org.id) { document.getElementById('report-content').innerHTML = '<p>Engagement not found.</p>'; return; }

      // Load all data — including Sprint 1-3 Pro planning workpapers.
      // Pro-gated tables may return empty for Essentials orgs (RLS); empty
      // results are handled gracefully by the render blocks below.
      const [
        sectionsRes, tbRes, profilesRes,
        eaccRes, elRes, eiRes, eiThreatsRes, eiNasRes,
        easRes,
        risksRes, riskLinksRes, riskAssessRes,
        cmRes, cmAttestRes
      ] = await Promise.all([
        supabaseClient.from('audit_sections').select('*').eq('engagement_id', engagementId).order('sort_order'),
        supabaseClient.from('trial_balance_lines').select('*').eq('engagement_id', engagementId).order('account_code'),
        supabaseClient.from('organization_members').select('*, profiles:user_id(id, full_name, email)').eq('organization_id', org.id),
        supabaseClient.from('engagement_acceptance').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_letters').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_independence').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_independence_threats').select('*'),
        supabaseClient.from('engagement_nas').select('*').eq('engagement_id', engagementId).order('created_at'),
        supabaseClient.from('engagement_audit_strategies').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_risks').select('*').eq('engagement_id', engagementId).order('section_id').order('created_at'),
        supabaseClient.from('engagement_risk_procedure_links').select('id, risk_id, procedure_id'),
        supabaseClient.from('engagement_risk_assessment').select('*').eq('engagement_id', engagementId).maybeSingle(),
        supabaseClient.from('engagement_completion_memo').select('*').eq('engagement_id', engagementId).maybeSingle(),
        supabaseClient.from('completion_attestations').select('*'),
      ]);

      // Active (non-superseded) versions of versioned workpapers
      const eaccActive = (eaccRes.data || []).find(r => !r.is_superseded) || null;
      const elActive   = (elRes.data   || []).find(r => !r.is_superseded) || null;
      const eiActive   = (eiRes.data   || []).find(r => !r.is_superseded) || null;
      const easActive  = (easRes.data  || []).find(r => !r.is_superseded) || null;
      const eiThreats  = eiActive ? (eiThreatsRes.data || []).filter(t => t.engagement_independence_id === eiActive.id) : [];
      const eiNas      = eiNasRes.data || [];
      const risks      = risksRes.data || [];
      const riskLinks  = riskLinksRes.data || [];
      const riskAssess = riskAssessRes.data || null;
      const cm         = cmRes.data || null;
      const cmAttests  = cm ? (cmAttestRes.data || []).filter(a => a.engagement_completion_memo_id === cm.id) : [];

      const sections = sectionsRes.data || [];
      const tbLines = tbRes.data || [];

      const profiles = {};
      (profilesRes.data || []).forEach(m => { if (m.profiles) profiles[m.profiles.id] = m.profiles.full_name || m.profiles.email; });

      // Load procedures, responses, documents, findings, review notes, adjusting entries per section
      const secIds = sections.map(s => s.id);
      let procedures = [], responses = [], documents = [], findings = [], reviewNotes = [], adjustingEntries = [];

      if (secIds.length > 0) {
        // Load procedures by section_id (not engagement_id)
        const { data: procs } = await supabaseClient.from('audit_procedures').select('*').in('section_id', secIds).order('sort_order');
        procedures = procs || [];

        const procIds = procedures.map(p => p.id);
        const [respRes, findRes, notesRes] = await Promise.all([
          procIds.length > 0 ? supabaseClient.from('procedure_responses').select('*').in('procedure_id', procIds) : { data: [] },
          supabaseClient.from('findings').select('*').in('section_id', secIds).order('created_at'),
          supabaseClient.from('review_notes').select('*, profiles:user_id(full_name, email)').in('section_id', secIds).order('created_at')
        ]);
        responses = respRes.data || [];
        findings = findRes.data || [];
        reviewNotes = notesRes.data || [];

        // Load documents
        const respIds = responses.map(r => r.id);
        if (respIds.length > 0) {
          const { data: docs } = await supabaseClient.from('documents').select('*').in('procedure_response_id', respIds);
          documents = docs || [];
        }
        const { data: secDocs } = await supabaseClient.from('documents').select('*').in('section_id', secIds).is('procedure_response_id', null);
        documents = [...documents, ...(secDocs || [])];

        // Load adjusting entries
        const findingIds = findings.map(f => f.id);
        if (findingIds.length > 0) {
          const { data: adj } = await supabaseClient.from('adjusting_entries').select('*').in('finding_id', findingIds);
          adjustingEntries = adj || [];
        }
      }

      // Compute stats (filtered by phase)
      const phaseFilter = document.getElementById('phase-filter').value;
      const filtSections = phaseFilter === 'all' ? sections
        : sections.filter(s => phaseFilter === 'interim' ? s.phase === 'interim' : s.phase !== 'interim');
      const filtSecIds = new Set(filtSections.map(s => s.id));
      const filtProcs = procedures.filter(p => filtSecIds.has(p.section_id));
      const filtProcIds = new Set(filtProcs.map(p => p.id));
      const filtResps = responses.filter(r => filtProcIds.has(r.procedure_id));
      const filtFindings = findings.filter(f => filtSecIds.has(f.section_id));

      const totalP = filtProcs.length;
      const doneP = filtResps.filter(r => r.status === 'done').length;
      const approvedS = filtSections.filter(s => s.status === 'approved').length;
      const openF = filtFindings.filter(f => f.status === 'open').length;
      const highF = filtFindings.filter(f => f.severity === 'high').length;
      const totalMisstatement = filtFindings.filter(f => f.finding_type === 'misstatement').reduce((s, f) => s + (Number(f.monetary_impact) || 0), 0);

      // Find partner and supervisor names
      const partnerMember = (profilesRes.data || []).find(m => m.role === 'admin');
      const supervisorMember = (profilesRes.data || []).find(m => m.role === 'supervisor');
      const partnerName = partnerMember?.profiles?.full_name || partnerMember?.profiles?.email || '—';
      const supervisorName = supervisorMember?.profiles?.full_name || supervisorMember?.profiles?.email || '—';

      let html = '';

      // ===== 1. COVER PAGE =====
      const phaseLabel = phaseFilter !== 'all' ? ' — ' + phaseFilter.charAt(0).toUpperCase() + phaseFilter.slice(1) + ' Phase' : '';
      html += `
        <div class="cover">
          <div class="cover-brand">Audexon Audit File</div>
          <div class="cover-divider"></div>
          <h1>${esc(eng.client_name)}</h1>
          <div class="cover-subtitle">Year ended ${eng.year_end_date || '—'}${phaseLabel}</div>
          <dl class="cover-details">
            <dt>Engagement Partner</dt><dd>${esc(partnerName)}</dd>
            <dt>Supervisor</dt><dd>${esc(supervisorName)}</dd>
            <dt>File Status</dt><dd>${eng.status === 'completed' ? 'Closed' : 'Active'}</dd>
            ${eng.closed_at ? `<dt>File Closed</dt><dd>${new Date(eng.closed_at).toLocaleDateString()}</dd>` : ''}
          </dl>
          <div class="cover-metrics">
            <div class="cover-metric"><div class="val">${filtSections.length}</div><div class="lbl">Sections</div></div>
            <div class="cover-metric"><div class="val">${doneP}/${totalP}</div><div class="lbl">Procedures</div></div>
            <div class="cover-metric"><div class="val">${approvedS}/${filtSections.length}</div><div class="lbl">Approved</div></div>
            <div class="cover-metric"><div class="val">${openF}</div><div class="lbl">Open Findings</div></div>
            <div class="cover-metric"><div class="val">${adjustingEntries.length}</div><div class="lbl">Adj. Entries</div></div>
            <div class="cover-metric"><div class="val">${filtFindings.filter(f => f.is_management_letter_point).length}</div><div class="lbl">ML Points</div></div>
          </div>
          <div class="cover-footer">Audexon Audit File — Confidential — Generated ${new Date().toLocaleDateString()} by ${esc(currentUser.email)}</div>
        </div>
      `;

      // ===== 1B. ENGAGEMENT PLANNING WORKPAPERS =====
      // Client Acceptance / Continuance (ISA 220)
      if (eaccActive) {
        html += '<h2>Client Acceptance / Continuance (ISA 220)</h2>';
        const TYPE_LABELS = { initial: 'Initial acceptance', continuance: 'Annual continuance' };
        const DEC_LABELS = { accept: 'Accepted', accept_with_conditions: 'Accepted with conditions', decline: 'Declined' };
        const statusBadge = eaccActive.status === 'confirmed'
          ? '<span class="badge b-approved">CONFIRMED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody>
          <tr><th style="width:32%;">Type</th><td>${esc(TYPE_LABELS[eaccActive.acceptance_type] || eaccActive.acceptance_type || '—')}</td></tr>
          <tr><th>Decision</th><td>${esc(DEC_LABELS[eaccActive.decision] || eaccActive.decision || '—')} ${statusBadge}</td></tr>
          <tr><th>Decision date</th><td>${eaccActive.decision_date || '—'}</td></tr>
          <tr><th>Risk tier</th><td>${esc(eaccActive.risk_tier || '—')}</td></tr>
          ${eaccActive.conditions_summary ? `<tr><th>Conditions</th><td>${esc(eaccActive.conditions_summary)}</td></tr>` : ''}
          ${eaccActive.decision_rationale ? `<tr><th>Rationale</th><td>${esc(eaccActive.decision_rationale)}</td></tr>` : ''}
          ${eaccActive.integrity_conclusion ? `<tr><th>Integrity conclusion</th><td>${esc(eaccActive.integrity_conclusion)}</td></tr>` : ''}
          ${eaccActive.competence_resources_notes ? `<tr><th>Competence &amp; resources</th><td>${esc(eaccActive.competence_resources_notes)}</td></tr>` : ''}
        </tbody></table>`;
      }

      // Engagement Letter (ISA 210)
      if (elActive) {
        html += '<h2>Engagement Letter (ISA 210)</h2>';
        const statusBadge = elActive.status === 'signed'
          ? '<span class="badge b-approved">SIGNED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td>${statusBadge}</td></tr>
          <tr><th>Letter date</th><td>${elActive.letter_date || '—'}</td></tr>
          <tr><th>Signed date</th><td>${elActive.signed_date || '—'}</td></tr>
          <tr><th>Client signatory</th><td>${esc(elActive.client_signatory_name || '—')}${elActive.client_signatory_role ? ' (' + esc(elActive.client_signatory_role) + ')' : ''}</td></tr>
          <tr><th>Reporting framework</th><td>${esc(elActive.reporting_framework || '—')}</td></tr>
          <tr><th>Audit period</th><td>${elActive.audit_period_start || '—'} to ${elActive.audit_period_end || '—'}</td></tr>
          ${elActive.file_name ? `<tr><th>Signed file</th><td>${esc(elActive.file_name)}${elActive.file_sha256 ? ' &middot; SHA-256: ' + elActive.file_sha256.slice(0,16) + '...' : ''}</td></tr>` : ''}
        </tbody></table>`;
        html += `<h4>ISA 210.10 minimum elements attested</h4>`;
        html += `<table><tbody>
          <tr><td style="width:80%;">Objective and scope of the audit</td><td style="text-align:center;">${elActive.isa_210_objective_scope ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Responsibilities of the auditor</td><td style="text-align:center;">${elActive.isa_210_auditor_responsibilities ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Responsibilities of management</td><td style="text-align:center;">${elActive.isa_210_mgmt_responsibilities ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Applicable financial reporting framework identified</td><td style="text-align:center;">${elActive.isa_210_framework_identified ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Expected form and content of any reports</td><td style="text-align:center;">${elActive.isa_210_report_form_referenced ? '&#10003;' : '&minus;'}</td></tr>
        </tbody></table>`;
      }

      // Independence & Ethics (ISA 220 R + IESBA)
      if (eiActive) {
        html += '<h2>Independence &amp; Ethics (ISA 220 R + IESBA)</h2>';
        const statusBadge = eiActive.status === 'confirmed'
          ? '<span class="badge b-approved">CONFIRMED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td>${statusBadge}</td></tr>
          <tr><th>Assessment date</th><td>${eiActive.assessment_date || '—'}</td></tr>
          <tr><th>Partner attestation</th><td>${eiActive.partner_attestation_made ? '&#10003; ' + (eiActive.partner_attestation_date || '') : '&minus;'}</td></tr>
          <tr><th>Fee % of firm total</th><td>${eiActive.fee_pct_of_firm_total != null ? eiActive.fee_pct_of_firm_total + '%' : '—'} ${eiActive.fee_dependence_band ? '<span class="badge b-' + (eiActive.fee_dependence_band === 'high' ? 'high' : 'medium') + '">' + eiActive.fee_dependence_band.toUpperCase() + '</span>' : ''}</td></tr>
          ${eiActive.fee_dependence_safeguards ? `<tr><th>Fee dependence safeguards</th><td>${esc(eiActive.fee_dependence_safeguards)}</td></tr>` : ''}
          <tr><th>Partner tenure (years)</th><td>${eiActive.partner_tenure_years != null ? eiActive.partner_tenure_years : '—'} ${eiActive.partner_rotation_required ? '<span class="badge b-medium">ROTATION DUE</span>' : ''}</td></tr>
          ${eiActive.partner_rotation_action ? `<tr><th>Rotation action</th><td>${esc(eiActive.partner_rotation_action)}</td></tr>` : ''}
          <tr><th>Non-audit services</th><td>${eiActive.no_nas_provided ? 'No NAS provided' : (eiNas.length + ' service(s) recorded')}</td></tr>
          ${eiActive.overall_conclusion ? `<tr><th>Overall conclusion</th><td>${esc(eiActive.overall_conclusion)}</td></tr>` : ''}
        </tbody></table>`;
        if (eiThreats.length > 0) {
          html += '<h4>IESBA threats assessed</h4>';
          html += '<table><thead><tr><th>Threat category</th><th>Identified?</th><th>Description</th><th>Safeguards</th></tr></thead><tbody>';
          eiThreats.forEach(t => {
            html += `<tr><td>${esc((t.threat_category || '').replace(/_/g,' '))}</td><td style="text-align:center;">${t.identified ? '&#10003;' : '&minus;'}</td><td>${esc(t.description || '—')}</td><td>${esc(t.safeguards || '—')}</td></tr>`;
          });
          html += '</tbody></table>';
        }
        if (eiNas.length > 0) {
          html += '<h4>Non-audit services</h4>';
          html += '<table><thead><tr><th>Service</th><th>Fee</th><th>Permitted?</th><th>Safeguards</th></tr></thead><tbody>';
          eiNas.forEach(n => {
            html += `<tr><td>${esc(n.service_description || '—')}</td><td>${n.fee_amount != null ? Number(n.fee_amount).toLocaleString() : '—'}</td><td style="text-align:center;">${n.is_permitted ? '&#10003;' : '&#10007;'}</td><td>${esc(n.safeguards || '—')}</td></tr>`;
          });
          html += '</tbody></table>';
        }
      }

      // Audit Strategy (ISA 300 + ISA 220 R)
      if (easActive) {
        html += '<h2>Audit Strategy (ISA 300)</h2>';
        const statusBadge = easActive.status === 'approved'
          ? '<span class="badge b-approved">APPROVED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody><tr><th style="width:32%;">Status</th><td>${statusBadge} ${easActive.approved_at ? '&middot; ' + new Date(easActive.approved_at).toLocaleDateString() : ''}</td></tr></tbody></table>`;
        const narrSection = (label, val) => val
          ? `<h4>${esc(label)}</h4><div style="font-size:11px; color:#374151; white-space:pre-wrap; margin-bottom:12px; line-height:1.6;">${esc(val)}</div>`
          : '';
        html += narrSection('1. Characteristics defining scope (ISA 300.9(a))',         easActive.scope_characteristics);
        html += narrSection('2. Reporting objectives, timing & communications (300.9(b))', easActive.reporting_objectives);
        html += narrSection('3. Significant factors directing the team (300.9(c))',     easActive.significant_factors);
        html += narrSection('4. Results of preliminary engagement activities (300.9(d))', easActive.preliminary_activities_summary);
        html += narrSection('5. Nature, timing & extent of resources (300.9(e))',       easActive.resources_plan);
        html += narrSection('Partner direction, supervision & review (ISA 220 R)',      easActive.partner_direction_plan);
        if (easActive.team_composition || easActive.specialists_involved || easActive.budgeted_hours || easActive.eqr_required) {
          html += '<h4>Team, specialists, EQR</h4>';
          html += '<table><tbody>';
          if (easActive.team_composition)     html += `<tr><th style="width:32%;">Team composition</th><td>${esc(easActive.team_composition)}</td></tr>`;
          if (easActive.specialists_involved) html += `<tr><th>Specialists</th><td>${esc(easActive.specialists_involved)}</td></tr>`;
          html += `<tr><th>EQR required</th><td>${easActive.eqr_required ? '&#10003; Yes — ' + esc(easActive.eqr_reviewer_name || '(reviewer not named)') : '&minus; No'}</td></tr>`;
          if (easActive.budgeted_hours)       html += `<tr><th>Budgeted hours</th><td>${easActive.budgeted_hours}</td></tr>`;
          html += '</tbody></table>';
        }
      }

      // ===== 2. PLANNING & MATERIALITY =====
      if (eng.materiality_overall) {
        const benchLabels = { pbt: 'Profit Before Tax', revenue: 'Revenue', assets: 'Total Assets', equity: 'Equity' };
        const benchLabel = benchLabels[eng.materiality_benchmark] || eng.materiality_benchmark || '—';
        const fmt = (n) => Number(n).toLocaleString(undefined, { minimumFractionDigits: 0 });

        html += '<h2>Planning & Materiality</h2>';
        html += `<table>
          <thead><tr><th>Item</th><th>Value</th></tr></thead>
          <tbody>
            <tr><td>Benchmark</td><td>${esc(benchLabel)}</td></tr>
            <tr><td>Benchmark Amount</td><td>${fmt(eng.materiality_amount)}</td></tr>
            <tr><td>Percentage Applied</td><td>${eng.materiality_pct}%</td></tr>
            <tr><td><strong>Overall Materiality</strong></td><td><strong>${fmt(eng.materiality_overall)}</strong></td></tr>
            <tr><td>Performance Materiality (${eng.materiality_perf_pct || 75}%)</td><td>${fmt(eng.materiality_performance)}</td></tr>
            <tr><td>Clearly Trivial Threshold (${eng.materiality_trivial_pct || 5}%)</td><td>${fmt(eng.materiality_trivial)}</td></tr>
          </tbody>
        </table>`;

        if (eng.materiality_rationale) {
          html += `<div style="background:#F5F7FA; border-left:3px solid #1A3A5F; padding:10px 14px; margin-bottom:16px; font-size:12px;">
            <div style="font-size:9px; font-weight:700; color:#1A3A5F; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;">Rationale (ISA 320)</div>
            ${esc(eng.materiality_rationale)}
          </div>`;
        }
      }

      // ===== 2B. RISK ASSESSMENT (ISA 315 + ISA 330 + ISA 240) =====
      if (risks.length > 0 || riskAssess) {
        html += '<h2>Risk Assessment (ISA 315 / ISA 330)</h2>';

        const ASSERT_LABELS = {
          existence:'Existence', completeness:'Completeness', accuracy:'Accuracy',
          valuation:'Valuation', cutoff:'Cut-off', classification:'Classification',
          rights_obligations:'Rights & obligations', presentation:'Presentation'
        };
        const SRC_LABELS = {
          entity:'Entity', industry:'Industry', it:'IT', fraud:'Fraud',
          management_override:'Mgmt override', rap:'RAP', other:'Other'
        };

        // Header summary
        const sigCount = risks.filter(r => r.is_significant).length;
        const linkedIds = new Set(riskLinks.map(l => l.risk_id));
        const linkedRiskCount = risks.filter(r => linkedIds.has(r.id)).length;
        const unlinkedSig = risks.filter(r => r.is_significant && !linkedIds.has(r.id)).length;
        const assessBadge = riskAssess && riskAssess.status === 'confirmed'
          ? `<span class="badge b-approved">CONFIRMED ${riskAssess.confirmed_at ? '&middot; ' + new Date(riskAssess.confirmed_at).toLocaleDateString() : ''}</span>`
          : `<span class="badge b-pending">DRAFT</span>`;
        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td>${assessBadge}</td></tr>
          <tr><th>Total risks identified</th><td>${risks.length}</td></tr>
          <tr><th>Significant risks</th><td>${sigCount}</td></tr>
          <tr><th>Risks with linked procedures</th><td>${linkedRiskCount} / ${risks.length}</td></tr>
          ${unlinkedSig > 0 ? `<tr><th>Unlinked significant risks</th><td style="color:#991B1B;font-weight:600;">${unlinkedSig} (ISA 330.21 violation)</td></tr>` : ''}
        </tbody></table>`;

        // Pivot matrix (sections × assertions)
        const assertionKeys = Object.keys(ASSERT_LABELS);
        const sectionsWithRisks = sections.filter(s => risks.some(r => r.section_id === s.id));
        if (sectionsWithRisks.length > 0) {
          html += '<h3>Risk matrix (sections &times; assertions)</h3>';
          html += '<table style="font-size:10px;"><thead><tr><th>Section</th>';
          assertionKeys.forEach(a => { html += `<th style="text-align:center;">${esc(ASSERT_LABELS[a])}</th>`; });
          html += '</tr></thead><tbody>';
          sectionsWithRisks.forEach(s => {
            html += `<tr><td>${esc(s.name)}</td>`;
            assertionKeys.forEach(a => {
              const cell = risks.filter(r => r.section_id === s.id && r.assertion === a);
              const sig = cell.filter(r => r.is_significant).length;
              if (!cell.length) {
                html += `<td style="text-align:center; color:#9ca3af;">&middot;</td>`;
              } else {
                html += `<td style="text-align:center; font-weight:600; ${sig ? 'background:#FEF9C3; color:#A16207;' : ''}">${cell.length}${sig ? ' (' + sig + ')' : ''}</td>`;
              }
            });
            html += '</tr>';
          });
          html += '</tbody></table>';
          html += '<p style="font-size:10px; color:#6b7280; margin:4px 0 14px;">Cells show risks identified; gold &amp; bold = significant risk count in brackets.</p>';
        }

        // Risk register grouped by section
        html += '<h3>Risk register</h3>';
        const risksBySection = {};
        risks.forEach(r => {
          if (!risksBySection[r.section_id]) risksBySection[r.section_id] = [];
          risksBySection[r.section_id].push(r);
        });
        sections.filter(s => risksBySection[s.id]).forEach(s => {
          html += `<h4>${esc(s.name)}</h4>`;
          html += '<table><thead><tr><th>Risk</th><th>Assertion</th><th>Source</th><th>I</th><th>C</th><th>=</th><th>Sig?</th><th>Linked procs</th></tr></thead><tbody>';
          risksBySection[s.id].forEach(r => {
            const linkedProcCount = riskLinks.filter(l => l.risk_id === r.id).length;
            const sigCell = r.is_significant
              ? '<span style="color:#A16207; font-weight:700;">&#9733; Yes</span>'
              : '&minus;';
            const presumedBadge = r.is_locked_presumed ? ' <span class="badge b-medium" style="font-size:8px;">PRESUMED</span>' : '';
            const rebuttedNote = r.presumption_rebutted
              ? `<div style="font-size:9px; color:#065F46; margin-top:3px;"><em>Rebutted (ISA 240.26): ${esc(r.rebuttal_rationale || '')}</em></div>`
              : '';
            html += `<tr>
              <td>${esc(r.risk_description)}${presumedBadge}${rebuttedNote}</td>
              <td>${esc(ASSERT_LABELS[r.assertion] || r.assertion)}</td>
              <td>${esc(SRC_LABELS[r.source] || r.source)}</td>
              <td style="text-align:center;">${r.inherent_rating[0].toUpperCase()}</td>
              <td style="text-align:center;">${r.control_rating[0].toUpperCase()}</td>
              <td style="text-align:center; font-weight:600;">${r.combined_rating[0].toUpperCase()}</td>
              <td style="text-align:center;">${sigCell}</td>
              <td style="text-align:center; ${r.is_significant && linkedProcCount === 0 ? 'color:#991B1B; font-weight:700;' : ''}">${linkedProcCount}</td>
            </tr>`;
            // Show overall response on a sub-row for significant risks
            if (r.is_significant && r.overall_response) {
              html += `<tr><td colspan="8" style="background:#FFFBEB; font-size:10px;"><strong>Overall response (ISA 330.5):</strong> ${esc(r.overall_response)}</td></tr>`;
            }
          });
          html += '</tbody></table>';
        });

        // Attestations summary
        if (riskAssess) {
          html += '<h4>Risk assessment attestations</h4>';
          html += '<table><tbody>';
          html += `<tr><td style="width:80%;">Risks assessed at assertion level (ISA 315.27)</td><td style="text-align:center;">${riskAssess.isa_315_27_assertions_assessed ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>Significant risks identified per professional judgement (ISA 315.28)</td><td style="text-align:center;">${riskAssess.isa_315_28_significant_risks_identified ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>Stand-back consideration of unflagged CoTABDs (ISA 315.A114)</td><td style="text-align:center;">${riskAssess.isa_315_stand_back_completed ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>All significant risks linked to responsive procedures (ISA 330.21)</td><td style="text-align:center;">${riskAssess.isa_330_responses_linked ? '&#10003;' : '&minus;'}</td></tr>`;
          html += '</tbody></table>';
        }
      }

      // ===== 3. FINDINGS & MISSTATEMENTS SUMMARY =====
      html += '<h2>Summary of Findings</h2>';
      if (filtFindings.length === 0) {
        html += '<p class="no-data">No findings recorded.</p>';
      } else {
        html += '<table><thead><tr><th>Finding Title</th><th>Section</th><th>Type</th><th>Severity</th><th>Status</th><th>ML</th><th>Adj.</th><th>Adj. Entry Status</th></tr></thead><tbody>';
        html += filtFindings.map(f => {
          const secName = sections.find(s => s.id === f.section_id)?.name || '—';
          const fAdj = adjustingEntries.filter(a => a.finding_id === f.id);
          const hasAdj = fAdj.length > 0;
          const adjStatus = hasAdj ? (fAdj.every(a => a.is_posted) ? 'Posted' : 'Not Posted') : '';
          return `<tr>
            <td>${esc(f.title)}</td>
            <td>${esc(secName)}</td>
            <td>${(f.finding_type || 'observation').replace(/_/g, ' ')}</td>
            <td><span style="color:${f.severity === 'high' ? '#991B1B' : f.severity === 'medium' ? '#92400E' : '#4B5563'};font-weight:600;">${f.severity.toUpperCase()}</span></td>
            <td><span style="color:${f.status === 'open' ? '#92400E' : f.status === 'resolved' ? '#065F46' : '#1E40AF'};font-weight:600;">${f.status.toUpperCase()}</span></td>
            <td>${f.is_management_letter_point ? 'Yes' : ''}</td>
            <td>${hasAdj ? 'Yes' : 'No'}</td>
            <td>${adjStatus ? `<span style="color:${adjStatus === 'Posted' ? '#065F46' : '#92400E'};font-weight:600;">${adjStatus.toUpperCase()}</span>` : ''}</td>
          </tr>`;
        }).join('');
        html += '</tbody></table>';
      }

      // Unadjusted misstatements — only misstatements with actual monetary impact
      const unadjusted = filtFindings.filter(f => f.finding_type === 'misstatement' && f.status !== 'resolved');
      if (unadjusted.length > 0) {
        html += '<h3>Summary of Unadjusted Misstatements (ISA 450)</h3>';
        html += '<table><thead><tr><th>Finding</th><th>Section</th><th>Amount</th><th>Categorization</th></tr></thead><tbody>';
        let totalUnadj = 0;
        html += unadjusted.map(f => {
          const secName = sections.find(s => s.id === f.section_id)?.name || '—';
          const amt = Number(f.monetary_impact) || 0;
          totalUnadj += amt;
          const cat = f.close_category ? f.close_category.replace(/_/g, ' ') : '—';
          return `<tr><td>${esc(f.title)}</td><td>${esc(secName)}</td><td>${amt.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td><td>${cat}</td></tr>`;
        }).join('');
        html += `<tr style="font-weight:700; border-top:2px solid #d1d5db;"><td colspan="2">Total Unadjusted</td><td>${totalUnadj.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td><td></td></tr>`;
        html += '</tbody></table>';
      }

      // ===== 3. SECTION-BY-SECTION WORKPAPERS =====
      html += '<h2>Section Workpapers</h2>';

      const interimSections = filtSections.filter(s => s.phase === 'interim');
      const finalSections = filtSections.filter(s => s.phase !== 'interim');
      const orderedSections = [...interimSections, ...finalSections];

      if (orderedSections.length === 0) {
        html += '<p class="no-data">No sections.</p>';
      }

      let currentPhase = '';
      for (const s of orderedSections) {
        const phase = s.phase || 'final';
        if (phase !== currentPhase) {
          currentPhase = phase;
          html += `<div class="phase-divider">${phase} Phase</div>`;
        }

        const assignee = s.assigned_to ? (profiles[s.assigned_to] || '—') : 'Unassigned';
        const secProcs = procedures.filter(p => p.section_id === s.id);
        const secFindings = findings.filter(f => f.section_id === s.id);
        const secDocs = documents.filter(d => d.section_id === s.id);
        const secNotes = reviewNotes.filter(n => n.section_id === s.id);

        // Sign-off info
        const supApproved = s.supervisor_approved_at ? new Date(s.supervisor_approved_at).toLocaleDateString() : '—';
        const supName = s.supervisor_approved_by ? (profiles[s.supervisor_approved_by] || '—') : '—';
        const partApproved = s.partner_approved_at ? new Date(s.partner_approved_at).toLocaleDateString() : '—';
        const partName2 = s.partner_approved_by ? (profiles[s.partner_approved_by] || '—') : '—';

        html += `<div class="wp-section">`;
        html += `<div class="wp-header">
          <div class="wp-title">${esc(s.name)} ${phase === 'interim' ? '<span class="badge b-interim">Interim</span>' : ''} <span class="badge b-${s.status === 'approved' ? 'approved' : 'pending'}">${s.status.replace(/_/g, ' ')}</span></div>
          <div class="wp-meta">Assigned: ${esc(assignee)} | Supervisor: ${esc(supName)} (${supApproved}) | Partner: ${esc(partName2)} (${partApproved})</div>
        </div>`;

        // Conclusion
        if (s.conclusion) {
          html += `<div class="wp-conclusion"><div class="wp-conclusion-label">Section Conclusion</div>${esc(s.conclusion)}</div>`;
        }

        // Procedures table
        html += '<h4>Procedures & Work Performed</h4>';
        if (secProcs.length === 0) {
          html += '<p class="no-data">No procedures.</p>';
        } else {
          html += '<table><thead><tr><th>Procedure</th><th>Type</th><th>Work Performed</th><th>Status</th></tr></thead><tbody>';
          for (const p of secProcs) {
            const resp = responses.find(r => r.procedure_id === p.id);
            const status = resp?.status || 'pending';
            html += `<tr>
              <td>${esc(p.description)}</td>
              <td>${esc(p.procedure_type.replace(/_/g, ' '))}</td>
              <td>${resp?.response ? esc(resp.response) : '<span style="color:#dc2626;font-style:italic;">Not recorded</span>'}</td>
              <td><span class="badge b-${status}">${status}</span></td>
            </tr>`;
          }
          html += '</tbody></table>';
        }

        // Documents table
        const allSecDocs = [...documents.filter(d => {
          const procIds = secProcs.map(p => p.id);
          const respIds = responses.filter(r => procIds.includes(r.procedure_id)).map(r => r.id);
          return respIds.includes(d.procedure_response_id) || d.section_id === s.id;
        })];
        if (allSecDocs.length > 0) {
          html += '<h4>Documents Referenced</h4>';
          html += '<table><thead><tr><th>File Name</th><th>Category</th><th>Description</th></tr></thead><tbody>';
          allSecDocs.forEach(d => {
            html += `<tr><td>${esc(d.file_name)}</td><td><span class="doc-cat">${d.doc_category === 'working_paper' ? 'Work File' : 'Client File'}</span></td><td>${esc(d.description || '—')}</td></tr>`;
          });
          html += '</tbody></table>';
        }

        // Section findings
        if (secFindings.length > 0) {
          html += '<h4>Finding Details</h4>';
          for (const f of secFindings) {
            const adjEntries = adjustingEntries.filter(a => a.finding_id === f.id);
            const sevColor = f.severity === 'high' ? '#991B1B' : f.severity === 'medium' ? '#92400E' : '#4B5563';
            const statusColor = f.status === 'open' ? '#92400E' : f.status === 'resolved' ? '#065F46' : '#1E40AF';

            html += `<div style="border:1px solid #D9D9D9; border-radius:4px; padding:14px 16px; margin-bottom:12px;">
              <div style="font-weight:700; font-size:13px; margin-bottom:6px;">${esc(f.title)}
                <span style="color:${sevColor}; font-size:11px; margin-left:8px;">${f.severity.toUpperCase()}</span>
                <span style="color:${statusColor}; font-size:11px; margin-left:8px;">${f.status.toUpperCase()}</span>
              </div>`;

            if (f.condition) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Description</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.condition)}</div></div>`;
            if (f.effect) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Impact</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.effect)}</div></div>`;
            if (f.recommendation) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Recommendation</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.recommendation)}</div></div>`;
            if (f.management_response) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Management Response</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.management_response)}</div></div>`;

            // ML flag + Adjusting entry status inline
            let footerParts = [];
            if (f.is_management_letter_point) footerParts.push('<span style="color:#3730A3;font-weight:600;">ML</span> Management Letter Point');
            else footerParts.push('No Management Letter point for this finding.');

            if (adjEntries.length > 0) {
              for (const a of adjEntries) {
                html += `<div style="border:1px solid #FDE68A; background:#FFFBEB; border-radius:4px; padding:8px 12px; margin-top:8px; font-size:11px;">
                  <strong>Adjusting Entry:</strong> Dr ${esc(a.debit_account)} / Cr ${esc(a.credit_account)} — ${Number(a.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}
                  ${a.narration ? ' (' + esc(a.narration) + ')' : ''}
                  <span style="color:${a.is_posted ? '#065F46' : '#92400E'}; font-weight:600; margin-left:8px;">${a.is_posted ? 'POSTED' : 'NOT POSTED'}</span>
                </div>`;
              }
            } else {
              footerParts.push('No adjusting entry.');
            }

            html += `<div style="font-size:10px; color:#6b7280; margin-top:10px; padding-top:8px; border-top:1px solid #EBEBEB;">${footerParts.join(' &nbsp;&nbsp;&nbsp; ')}</div>`;
            html += '</div>';
          }
        }

        // Review notes table
        const significantNotes = secNotes.filter(n => n.note_type === 'review_comment' || n.note_type === 'return_reason');
        if (significantNotes.length > 0) {
          html += '<h4>Review Notes</h4>';
          html += '<table><thead><tr><th>Reviewer</th><th>Date</th><th>Note</th><th>Type</th></tr></thead><tbody>';
          significantNotes.forEach(n => {
            const who = n.profiles?.full_name || n.profiles?.email || 'User';
            const date = new Date(n.created_at).toLocaleDateString();
            const typeLabel = n.note_type === 'return_reason' ? 'Return' : 'Review';
            html += `<tr><td>${esc(who)}</td><td>${date}</td><td>${esc(n.note)}</td><td>${typeLabel}</td></tr>`;
          });
          html += '</tbody></table>';
        }

        html += '</div>'; // wp-section
      }

      // ===== 4. MANAGEMENT LETTER POINTS =====
      const mlFindings = filtFindings.filter(f => f.is_management_letter_point);
      html += '<h2>Management Letter Points</h2>';
      if (mlFindings.length === 0) {
        html += '<p class="no-data">No management letter points.</p>';
      } else {
        html += '<table><thead><tr><th>#</th><th>Finding</th><th>Section</th><th>Severity</th><th>Recommendation</th></tr></thead><tbody>';
        mlFindings.forEach((f, i) => {
          const secName = sections.find(s => s.id === f.section_id)?.name || '—';
          html += `<tr><td>${i + 1}</td><td>${esc(f.title)}</td><td>${esc(secName)}</td><td><span class="badge b-${f.severity}">${f.severity}</span></td><td>${esc(f.recommendation || '—')}</td></tr>`;
        });
        html += '</tbody></table>';
      }

      // ===== 4B. COMPLETION MEMO (ISA 220 / ISA 700) =====
      if (cm) {
        html += '<h2>Engagement Completion Memorandum</h2>';
        const cmStatus = cm.status === 'locked' ? 'b-approved' : (cm.status === 'complete' ? 'b-reported' : 'b-pending');
        const cmStatusLabel = cm.status === 'locked' ? 'LOCKED &amp; SIGNED' : cm.status.toUpperCase();
        const fmt = (n) => n != null ? Number(n).toLocaleString(undefined, { minimumFractionDigits: 0 }) : '—';
        const partnerSignedBy = cm.signed_by ? (profiles[cm.signed_by] || '—') : '—';

        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td><span class="badge ${cmStatus}">${cmStatusLabel}</span> ${cm.signed_at ? '&middot; signed ' + new Date(cm.signed_at).toLocaleDateString() + ' by ' + esc(partnerSignedBy) : ''}</td></tr>
          <tr><th>Opinion type</th><td>${esc((cm.opinion_type || '—').toUpperCase())}</td></tr>
          ${cm.opinion_basis_notes ? `<tr><th>Opinion basis</th><td>${esc(cm.opinion_basis_notes)}</td></tr>` : ''}
          <tr><th>Sections approved</th><td>${cm.sections_approved} / ${cm.total_sections}</td></tr>
          <tr><th>Findings (open / resolved / reported)</th><td>${cm.findings_open} / ${cm.findings_resolved} / ${cm.findings_reported}</td></tr>
          <tr><th>Adjusting entries (posted / unposted)</th><td>${cm.posted_adjustments} / ${cm.unposted_adjustments}</td></tr>
          ${cm.overall_materiality_snapshot ? `<tr><th>Materiality (overall / performance)</th><td>${fmt(cm.overall_materiality_snapshot)} / ${fmt(cm.performance_materiality_snapshot)}</td></tr>` : ''}
          ${cm.uncorrected_vs_materiality ? `<tr><th>Uncorrected vs materiality</th><td>${esc(cm.uncorrected_vs_materiality.replace(/_/g, ' '))}</td></tr>` : ''}
          <tr><th>EQR required</th><td>${cm.eqr_required ? '&#10003; Yes' : '&minus; No'}${cm.eqr_completed_at ? ' &middot; completed ' + new Date(cm.eqr_completed_at).toLocaleDateString() : ''}</td></tr>
        </tbody></table>`;

        if (cm.going_concern_conclusion) {
          html += `<h4>Going concern conclusion (ISA 570)</h4>`;
          html += `<div style="font-size:11px; color:#374151; white-space:pre-wrap; line-height:1.6; margin-bottom:12px;">${esc(cm.going_concern_conclusion)}</div>`;
        }
        if (cm.subsequent_events_conclusion) {
          html += `<h4>Subsequent events (ISA 560)</h4>`;
          html += `<div style="font-size:11px; color:#374151; white-space:pre-wrap; line-height:1.6; margin-bottom:12px;">${esc(cm.subsequent_events_conclusion)}</div>`;
        }
        if (cm.other_matters) {
          html += `<h4>Other matters</h4>`;
          html += `<div style="font-size:11px; color:#374151; white-space:pre-wrap; line-height:1.6; margin-bottom:12px;">${esc(cm.other_matters)}</div>`;
        }

        if (cmAttests.length > 0) {
          html += '<h4>Partner attestations</h4>';
          html += '<table><thead><tr><th>Attestation</th><th style="text-align:center; width:50px;">Ack</th><th>By</th><th>At</th></tr></thead><tbody>';
          cmAttests.forEach(a => {
            const who = a.acknowledged_by ? (profiles[a.acknowledged_by] || '—') : '—';
            const when = a.acknowledged_at ? new Date(a.acknowledged_at).toLocaleDateString() : '—';
            html += `<tr><td>${esc(a.attestation_text || '—')}</td><td style="text-align:center;">${a.is_acknowledged ? '&#10003;' : '&minus;'}</td><td>${esc(who)}</td><td>${when}</td></tr>`;
          });
          html += '</tbody></table>';
        }
      }

      // ===== 5. TRIAL BALANCE SUMMARY =====
      html += '<h2>Trial Balance Summary</h2>';
      if (tbLines.length === 0) {
        html += '<p class="no-data">No trial balance imported.</p>';
      } else {
        const groups = {};
        tbLines.forEach(line => {
          const cls = line.classification || 'Unclassified';
          if (!groups[cls]) groups[cls] = { count: 0, total: 0 };
          groups[cls].count++;
          groups[cls].total += parseFloat(line.balance) || 0;
        });
        html += '<table><thead><tr><th>Classification</th><th>Lines</th><th>Total Balance</th></tr></thead><tbody>';
        html += Object.entries(groups).map(([cls, g]) =>
          `<tr><td>${esc(cls)}</td><td>${g.count}</td><td style="text-align:right;">${g.total.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`
        ).join('');
        html += '</tbody></table>';
      }

      document.getElementById('report-content').innerHTML = html;
      document.title = eng.client_name + ' — Audit File — Audexon';
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
