<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit File — Audexon</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0D1626; line-height: 1.6; padding: 0; max-width: 900px; margin: 0 auto; font-size: 12px; }

    /* ---- Cover (formal partner-report layout) ---- */
    .cover { padding: 0 0 40px; margin-bottom: 0; page-break-after: always; min-height: 90vh; display: flex; flex-direction: column; }
    .cover-topbar {
      background: #0A1A2F; color: white; padding: 14px 40px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .cover-firm { font-weight: 700; letter-spacing: 2px; }
    .cover-confidential {
      background: rgba(255,255,255,0.10);
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 10px;
      letter-spacing: 1.2px;
    }
    .cover-body { padding: 64px 56px 0; flex: 1; }
    .cover-type-label {
      font-size: 11px; font-weight: 700; color: #3A7BFF;
      letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 12px;
    }
    .cover h1 { font-size: 36px; font-weight: 700; color: #0A1A2F; margin-bottom: 6px; letter-spacing: -0.5px; }
    .cover-subtitle { font-size: 15px; color: #555; margin-bottom: 40px; font-weight: 400; }
    .cover-rule { height: 1px; background: #E5E5EA; margin: 0 0 28px; }
    .cover-details {
      display: grid; grid-template-columns: 180px 1fr; gap: 14px 24px;
      max-width: 560px; margin-bottom: 36px; font-size: 12px;
    }
    .cover-details dt { font-weight: 600; color: #6E6E73; text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; padding-top: 1px; }
    .cover-details dd { color: #0A1A2F; font-weight: 500; }
    .cover-details dd.muted { color: #86868B; font-weight: 400; font-style: italic; }
    .cover-stats { display: flex; gap: 28px; max-width: 560px; padding: 18px 0; border-top: 1px solid #E5E5EA; border-bottom: 1px solid #E5E5EA; }
    .cover-stat { font-size: 12px; }
    .cover-stat .lbl { font-size: 10px; color: #6E6E73; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .cover-stat .val { font-size: 18px; font-weight: 700; color: #0A1A2F; }
    .cover-stat .val.alert { color: #C02A2A; }
    .cover-stat .val.ok { color: #177A42; }
    .cover-footer {
      font-size: 10px; color: #86868B; padding: 16px 56px; margin-top: auto;
      border-top: 1px solid #E5E5EA; display: flex; justify-content: space-between;
    }

    /* ---- Status chips (replaces bold uppercase status text) ---- */
    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      vertical-align: middle;
      line-height: 1.5;
    }
    .chip-grey   { background: #F5F5F7; color: #6E6E73; border: 1px solid #E5E5EA; }
    .chip-amber  { background: #FEF6E0; color: #92400E; border: 1px solid #FDE68A; }
    .chip-green  { background: #DCFCE7; color: #15803D; border: 1px solid #BBF7D0; }
    .chip-blue   { background: #DBEAFE; color: #1E40AF; border: 1px solid #BFDBFE; }
    .chip-red    { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
    .chip-violet { background: #EDE9FE; color: #5B21B6; border: 1px solid #DDD6FE; }

    /* ---- Running page header (print only) ---- */
    .page-hdr {
      font-size: 9px; color: #86868B; padding: 8px 0;
      margin-bottom: 16px; border-bottom: 1px solid #E5E5EA;
      display: flex; justify-content: space-between;
    }

    /* ---- Page header/footer ---- */
    .page-hdr { font-size: 9px; color: #9ca3af; padding: 8px 0; margin-bottom: 20px; border-bottom: 1px solid #E5E7EB; display: flex; justify-content: space-between; }

    /* ---- Headings ---- */
    h2 { font-size: 16px; font-weight: 700; color: #1A3A5F; margin: 36px 0 16px; padding: 10px 0 8px; border-bottom: 2px solid #1A3A5F; page-break-after: avoid; text-transform: uppercase; letter-spacing: 0.5px; }
    h3 { font-size: 13px; font-weight: 700; margin: 20px 0 8px; color: #1A3A5F; page-break-after: avoid; }
    h4 { font-size: 11px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px; }

    /* ---- Tables ---- */
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 16px; border: 1px solid #D9D9D9; }
    th { text-align: left; padding: 8px 10px; font-weight: 700; color: #1A3A5F; font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; background: #F5F7FA; border-bottom: 2px solid #D9D9D9; }
    td { padding: 7px 10px; border-bottom: 1px solid #EBEBEB; vertical-align: top; }
    tr:nth-child(even) td { background: #FAFBFC; }

    /* ---- Badges ---- */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
    .b-approved { background: #D1FAE5; color: #065F46; }
    .b-open { background: #FEF3C7; color: #92400E; }
    .b-resolved { background: #D1FAE5; color: #065F46; }
    .b-reported { background: #DBEAFE; color: #1E40AF; }
    .b-high { background: #FEE2E2; color: #991B1B; }
    .b-medium { background: #FEF3C7; color: #92400E; }
    .b-low { background: #F3F4F6; color: #4B5563; }
    .b-done { background: #D1FAE5; color: #065F46; }
    .b-pending { background: #F3F4F6; color: #4B5563; }
    .b-interim { background: #E0E7FF; color: #3730A3; }
    .b-ml { background: #E0E7FF; color: #3730A3; }

    /* ---- Section workpaper ---- */
    .wp-section { margin-bottom: 24px; }
    .wp-header { background: #F5F7FA; border: 1px solid #D9D9D9; border-radius: 4px; padding: 14px 18px; margin-bottom: 16px; }
    .wp-title { font-size: 15px; font-weight: 700; color: #1A1A2E; }
    .wp-meta { font-size: 10px; color: #6b7280; margin-top: 4px; line-height: 1.5; }
    .wp-conclusion { background: #F0FDF4; border-left: 4px solid #059669; padding: 12px 16px; margin: 12px 0; font-size: 12px; color: #1A1A2E; }
    .wp-conclusion-label { font-size: 9px; font-weight: 700; color: #059669; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }

    /* ---- Procedures ---- */
    .proc-block { margin-bottom: 12px; padding: 10px 14px; background: #FAFBFC; border: 1px solid #EBEBEB; border-radius: 4px; }
    .proc-desc { font-weight: 600; font-size: 12px; color: #1A1A2E; margin-bottom: 4px; }
    .proc-meta { font-size: 10px; color: #6b7280; }
    .proc-response { font-size: 11px; margin-top: 6px; white-space: pre-wrap; color: #374151; line-height: 1.5; }
    .proc-response-label { font-size: 9px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }

    /* ---- Findings ---- */
    .finding-block { background: #FAFBFC; border: 1px solid #D9D9D9; border-left: 4px solid #1A3A5F; border-radius: 4px; padding: 12px 16px; margin-bottom: 12px; }
    .finding-title { font-weight: 700; font-size: 13px; color: #1A1A2E; }
    .finding-detail { font-size: 11px; color: #374151; margin-top: 4px; line-height: 1.5; }
    .finding-detail-label { font-size: 9px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }
    .adj-entry { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 4px; padding: 8px 12px; margin-top: 8px; font-size: 11px; }

    /* ---- Review notes ---- */
    .rn-item { font-size: 11px; margin-bottom: 8px; padding: 6px 0; border-bottom: 1px solid #EBEBEB; }
    .rn-meta { font-size: 9px; color: #9ca3af; font-weight: 600; }

    /* ---- Documents ---- */
    .doc-row { font-size: 11px; padding: 4px 0; }
    .doc-cat { font-size: 9px; color: white; background: #1A3A5F; padding: 1px 6px; border-radius: 2px; font-weight: 600; }

    .no-data { font-size: 11px; color: #9ca3af; font-style: italic; padding: 8px 0; }

    /* ---- Print bar ---- */
    .print-bar { display: flex; gap: 8px; padding: 16px 24px; background: #F5F7FA; border-bottom: 1px solid #D9D9D9; position: sticky; top: 0; z-index: 10; }
    .print-bar button, .print-bar select { padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; border: 1px solid #D9D9D9; font-family: inherit; }
    .btn-print { background: #1A3A5F; color: white; border-color: #1A3A5F; }
    .btn-back { background: white; color: #374151; }

    /* ---- Phase label ---- */
    .phase-divider { font-size: 11px; font-weight: 700; color: #1A3A5F; text-transform: uppercase; letter-spacing: 1px; padding: 8px 0; margin: 24px 0 8px; border-bottom: 1px solid #D9D9D9; }

    /* ---- Print: page numbers via @page counter, running header ---- */
    @page {
      margin: 16mm 14mm 20mm;
      @bottom-right {
        content: counter(page) " / " counter(pages);
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 9px;
        color: #86868B;
      }
      @bottom-left {
        content: var(--page-footer-text, "Audexon — Confidential");
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 9px;
        color: #86868B;
      }
    }
    @page :first {
      margin: 0;
      @bottom-right { content: none; }
      @bottom-left { content: none; }
    }
    @media print {
      .print-bar { display: none; }
      body { padding: 0; font-size: 10px; max-width: none; margin: 0; }
      /* Force background colors to print (Chrome dialog default is OFF) */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .cover { page-break-after: always; padding: 0; min-height: auto; }
      .cover-body { padding: 64px 56px 0; }
      .wp-header { page-break-inside: avoid; page-break-after: avoid; }
      .proc-block { page-break-inside: avoid; }
      .finding-block { page-break-inside: avoid; }
      /* Sections flow naturally — only avoid breaks INSIDE atomic units */
      h2 { page-break-after: avoid; break-after: avoid; }
      h4 { page-break-after: avoid; break-after: avoid; }
      .phase-divider { page-break-after: avoid; }
      table { break-inside: auto; }
      tr, .risk-group { break-inside: avoid; page-break-inside: avoid; }
      .page-hdr { display: none; }
    }
    /* Force background printing on cover topbar even outside @media print */
    .cover-topbar { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    @media screen {
      body { padding: 0 24px 40px; }
      .page-hdr { display: none; }
    }
  </style>
  <!-- Sentry error tracking (no-op until window.SENTRY_DSN is set in sentry-init.js) -->
  <script src="https://browser.sentry-cdn.com/7.99.0/bundle.min.js" crossorigin="anonymous"></script>
  <script src="../js/sentry-init.js"></script>
</head>
<body>
  <div class="print-bar">
    <select id="report-type-select" onchange="changeReportType()" style="padding:8px 12px; font-size:14px; border-radius:6px; border:1px solid #d1d5db;">
      <option value="planning">Planning Memorandum (ISA 300)</option>
      <option value="execution">Audit File (ISA 230)</option>
      <option value="completion">Completion Memorandum (ISA 700)</option>
    </select>
    <button class="btn-print" onclick="window.print()">Save as PDF</button>
    <button class="btn-back" onclick="window.close()">Close</button>
  </div>

  <div id="report-content">Loading...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const engagementId = urlParams.get('id');
    const _rawType     = urlParams.get('type');
    const reportType   = (_rawType === 'completion' || _rawType === 'execution') ? _rawType : 'planning';
    const isExec       = reportType === 'execution';      // Execution / Audit File (full section workpapers)
    const isCompletion = reportType === 'completion';
    // Findings, misstatement schedule, ML points and TB summary are shared by the
    // Completion memo AND the Audit File. The completion memo body + ISA 540/505/530
    // recaps stay completion-only; the full section workpapers are execution-only.
    const showFindingsTbMl = isCompletion || isExec;
    if (!engagementId) { document.body.innerHTML = '<p>No engagement ID.</p>'; }

    function changeReportType() {
      const sel = document.getElementById('report-type-select').value;
      const u = new URL(window.location.href);
      u.searchParams.set('type', sel);
      window.location.href = u.toString();
    }

    // Long-form date: "31 December 2025"
    function formatDateLong(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Pick the actual signing partner, not just any org admin.
    // Priority: completion memo signer -> most recent section partner_approved_by ->
    // any org admin/owner -> current authenticated user (PDF generator).
    function findEngagementPartner(cm, sections, profiles, profilesRes, currentUser) {
      if (cm?.signed_by && profiles[cm.signed_by]) return profiles[cm.signed_by];
      const approvedSecs = sections
        .filter(s => s.partner_approved_by && s.partner_approved_at)
        .sort((a, b) => new Date(b.partner_approved_at) - new Date(a.partner_approved_at));
      if (approvedSecs[0] && profiles[approvedSecs[0].partner_approved_by]) {
        return profiles[approvedSecs[0].partner_approved_by];
      }
      // Try common admin role variants (handles role string differences across orgs)
      const adminRoles = ['admin', 'owner', 'partner'];
      const partnerMember = (profilesRes.data || []).find(m =>
        m.role && adminRoles.includes(String(m.role).toLowerCase())
      );
      if (partnerMember?.profiles) {
        return partnerMember.profiles.full_name || partnerMember.profiles.email;
      }
      // Final fallback: the user generating the PDF (almost always the partner in small firms)
      return currentUser?.user_metadata?.full_name || currentUser?.email || null;
    }
    function findSupervisor(sections, profiles, profilesRes) {
      const approvedSecs = sections
        .filter(s => s.supervisor_approved_by && s.supervisor_approved_at)
        .sort((a, b) => new Date(b.supervisor_approved_at) - new Date(a.supervisor_approved_at));
      if (approvedSecs[0] && profiles[approvedSecs[0].supervisor_approved_by]) {
        return profiles[approvedSecs[0].supervisor_approved_by];
      }
      const supervisorRoles = ['supervisor', 'manager', 'senior'];
      const supervisorMember = (profilesRes.data || []).find(m =>
        m.role && supervisorRoles.includes(String(m.role).toLowerCase())
      );
      return supervisorMember?.profiles?.full_name || supervisorMember?.profiles?.email || null;
    }

    // Status -> chip mapping. Returns an HTML span.
    function statusChip(status) {
      if (!status) return '';
      const s = String(status).toLowerCase();
      const map = {
        'approved':          ['Approved',   'chip-green'],
        'confirmed':         ['Confirmed',  'chip-green'],
        'signed':            ['Signed',     'chip-green'],
        'complete':          ['Complete',   'chip-green'],
        'locked':            ['Locked',     'chip-green'],
        'in_progress':       ['In progress','chip-amber'],
        'in progress':       ['In progress','chip-amber'],
        'ready_for_supervisor_review': ['Ready: supervisor', 'chip-amber'],
        'in_supervisor_review':        ['In supervisor review', 'chip-amber'],
        'ready_for_partner_review':    ['Ready: partner',   'chip-amber'],
        'in_partner_review':           ['In partner review','chip-amber'],
        'returned_to_preparer':        ['Returned',         'chip-violet'],
        'returned_to_supervisor':      ['Returned',         'chip-violet'],
        'not_started':       ['Not started','chip-grey'],
        'draft':             ['Draft',      'chip-grey'],
        'pending':           ['Pending',    'chip-grey'],
        'done':              ['Done',       'chip-green'],
        'open':              ['Open',       'chip-amber'],
        'resolved':          ['Resolved',   'chip-green'],
        'reported':          ['Reported',   'chip-blue'],
      };
      const [label, cls] = map[s] || [String(status).replace(/_/g, ' '), 'chip-grey'];
      return `<span class="chip ${cls}">${label}</span>`;
    }

    // ISA-precise labels for the procedures table (type + ISA 315 assertions)
    const PROC_TYPE_LABEL = { test_of_detail:'Test of Details', analytical:'Substantive Analytical', controls:'Test of Controls', other:'Risk Assessment / Admin' };
    const ASSERTION_LABEL = { existence:'Existence', occurrence:'Occurrence', completeness:'Completeness', accuracy:'Accuracy', valuation:'Valuation & Allocation', cutoff:'Cut-off', classification:'Classification', rights_obligations:'Rights & Obligations', presentation:'Presentation & Disclosure', fs_level:'FS-level / Pervasive' };

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = '/pages/login.html'; return; }
      const currentUser = session.user;
      const org = await getUserOrg();
      if (!org) { window.location.href = '/pages/onboarding.html'; return; }

      const { data: eng } = await supabaseClient.from('engagements').select('*').eq('id', engagementId).single();
      if (!eng || eng.organization_id !== org.id) { document.getElementById('report-content').innerHTML = '<p>Engagement not found.</p>'; return; }

      // Load all data — including Sprint 1-3 Pro planning workpapers.
      // Pro-gated tables may return empty for Essentials orgs (RLS); empty
      // results are handled gracefully by the render blocks below.
      const [
        sectionsRes, tbRes, profilesRes,
        eaccRes, elRes, eiRes, eiThreatsRes, eiNasRes,
        easRes,
        risksRes, riskLinksRes, riskAssessRes, controlsRes,
        cmRes, cmAttestRes,
        matVersRes, matItemsRes,
        estimatesRes, confirmationsRes, samplingsRes
      ] = await Promise.all([
        supabaseClient.from('audit_sections').select('*').eq('engagement_id', engagementId).order('sort_order'),
        supabaseClient.from('trial_balance_lines').select('*').eq('engagement_id', engagementId).order('account_code'),
        supabaseClient.from('organization_members').select('*, profiles:user_id(id, full_name, email)').eq('organization_id', org.id),
        supabaseClient.from('engagement_acceptance').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_letters').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_independence').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_independence_threats').select('*'),
        supabaseClient.from('engagement_nas').select('*').eq('engagement_id', engagementId).order('created_at'),
        supabaseClient.from('engagement_audit_strategies').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: false }),
        supabaseClient.from('engagement_risks').select('*').eq('engagement_id', engagementId).order('section_id').order('created_at'),
        supabaseClient.from('engagement_risk_procedure_links').select('id, risk_id, procedure_id'),
        supabaseClient.from('engagement_risk_assessment').select('*').eq('engagement_id', engagementId).maybeSingle(),
        supabaseClient.from('engagement_controls').select('*').eq('engagement_id', engagementId).order('created_at'),
        supabaseClient.from('engagement_completion_memo').select('*').eq('engagement_id', engagementId).maybeSingle(),
        supabaseClient.from('completion_attestations').select('*'),
        supabaseClient.from('engagement_materiality_versions').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: true }),
        supabaseClient.from('engagement_specific_materiality_items').select('*'),
        supabaseClient.from('engagement_estimates').select('*').eq('engagement_id', engagementId).order('created_at'),
        supabaseClient.from('engagement_confirmations').select('*').eq('engagement_id', engagementId).order('created_at'),
        // ISA 530 sampling: child of audit_procedures. We fetch all rows for procedures in this
        // engagement. The procedures themselves are loaded a few lines below (procedures const).
        supabaseClient.from('procedure_sampling').select('*'),
      ]);

      // Active (non-superseded) versions of versioned workpapers
      const eaccActive = (eaccRes.data || []).find(r => !r.is_superseded) || null;
      const elActive   = (elRes.data   || []).find(r => !r.is_superseded) || null;
      const eiActive   = (eiRes.data   || []).find(r => !r.is_superseded) || null;
      const easActive  = (easRes.data  || []).find(r => !r.is_superseded) || null;
      const eiThreats  = eiActive ? (eiThreatsRes.data || []).filter(t => t.engagement_independence_id === eiActive.id) : [];
      const eiNas      = eiNasRes.data || [];
      const risks      = risksRes.data || [];
      const riskLinks  = riskLinksRes.data || [];
      const riskAssess = riskAssessRes.data || null;
      const controls   = controlsRes.data || [];
      const cm         = cmRes.data || null;
      const cmAttests  = cm ? (cmAttestRes.data || []).filter(a => a.engagement_completion_memo_id === cm.id) : [];
      const estimates     = estimatesRes.data || [];
      const confirmations = confirmationsRes.data || [];
      const samplingsAll  = samplingsRes.data || [];

      // Materiality: versioned workpaper (ISA 320). Sort ascending — first is "planning".
      const matAllVersions = matVersRes.data || [];
      const matActive   = matAllVersions.find(v => !v.is_superseded) || null;
      // "Planning materiality" = the earliest version (v1, originally approved at planning).
      // "Revised materiality" = the active version if v2+. Same row if not revised.
      const matPlanning = matAllVersions[0] || null;
      const matIsRevised = !!(matActive && matPlanning && matActive.id !== matPlanning.id);
      // Keep the full set; filter per-version where the planning vs completion
      // render decides which version's items to display.
      const matAllItems = matItemsRes.data || [];

      const sections = sectionsRes.data || [];
      const tbLines = tbRes.data || [];

      // AML / KYC (DNFBP CDD) — for the planning memorandum.
      let amlCdd = null, amlOwnersRpt = [];
      {
        const { data: amlRows } = await supabaseClient.from('engagement_aml_cdd').select('*').eq('engagement_id', engagementId).limit(1);
        amlCdd = (amlRows && amlRows[0]) || null;
        if (amlCdd) {
          const { data: bos } = await supabaseClient.from('engagement_aml_beneficial_owners').select('*').eq('aml_cdd_id', amlCdd.id).order('sort_order');
          amlOwnersRpt = bos || [];
        }
      }

      // PBC requests + per-member budget — for the planning memorandum.
      let pbcRpt = [], budgetRpt = [];
      {
        const { data: pbc } = await supabaseClient.from('engagement_pbc_items').select('*').eq('engagement_id', engagementId).order('sort_order');
        pbcRpt = pbc || [];
        const { data: bh } = await supabaseClient.from('engagement_budget_hours').select('*').eq('engagement_id', engagementId).order('sort_order');
        budgetRpt = bh || [];
      }

      // Working TB journals (ISA 450) — adjusted TB + uncorrected misstatements summary (completion).
      let journalEntries = [], journalLines = [];
      {
        const { data: jes } = await supabaseClient.from('journal_entries').select('*').eq('engagement_id', engagementId).order('created_at', { ascending: true });
        journalEntries = jes || [];
        if (journalEntries.length) {
          const jids = journalEntries.map(e => e.id);
          const { data: jls } = await supabaseClient.from('journal_lines').select('*').in('journal_entry_id', jids);
          journalLines = jls || [];
        }
      }

      const profiles = {};
      (profilesRes.data || []).forEach(m => {
        if (m.profiles) {
          // Always store a non-empty label so signer/approver lookups
          // never render as an empty string in the PDF. Priority:
          // full_name → email → "User <short-id>" so the row is never
          // blank in the rendered tables.
          profiles[m.profiles.id] = m.profiles.full_name
            || m.profiles.email
            || ('User ' + String(m.profiles.id).slice(0, 8));
        }
      });

      // Load procedures, responses, documents, findings, review notes, adjusting entries per section
      const secIds = sections.map(s => s.id);
      let procedures = [], responses = [], documents = [], findings = [], reviewNotes = [], adjustingEntries = [];

      if (secIds.length > 0) {
        // Load procedures by section_id (not engagement_id)
        const { data: procs } = await supabaseClient.from('audit_procedures').select('*').in('section_id', secIds).order('sort_order');
        procedures = procs || [];

        const procIds = procedures.map(p => p.id);
        const [respRes, findRes, notesRes] = await Promise.all([
          procIds.length > 0 ? supabaseClient.from('procedure_responses').select('*').in('procedure_id', procIds) : { data: [] },
          supabaseClient.from('findings').select('*').in('section_id', secIds).order('created_at'),
          supabaseClient.from('review_notes').select('*, profiles:user_id(full_name, email)').in('section_id', secIds).order('created_at')
        ]);
        responses = respRes.data || [];
        findings = findRes.data || [];
        reviewNotes = notesRes.data || [];

        // Load documents
        const respIds = responses.map(r => r.id);
        if (respIds.length > 0) {
          const { data: docs } = await supabaseClient.from('documents').select('*').in('procedure_response_id', respIds);
          documents = docs || [];
        }
        const { data: secDocs } = await supabaseClient.from('documents').select('*').in('section_id', secIds).is('procedure_response_id', null);
        documents = [...documents, ...(secDocs || [])];

        // Load adjusting entries
        const findingIds = findings.map(f => f.id);
        if (findingIds.length > 0) {
          const { data: adj } = await supabaseClient.from('adjusting_entries').select('*').in('finding_id', findingIds);
          adjustingEntries = adj || [];
        }
      }

      // Sync dropdown with URL param
      const rtSel = document.getElementById('report-type-select');
      if (rtSel) rtSel.value = reportType;

      // No phase filtering anymore — report type drives content (planning vs completion).
      const filtSections = sections;
      const filtSecIds   = new Set(sections.map(s => s.id));
      const filtProcs    = procedures;
      const filtProcIds  = new Set(procedures.map(p => p.id));
      const filtResps    = responses;
      const filtFindings = findings;

      const totalP = filtProcs.length;
      const doneP = filtResps.filter(r => r.status === 'done').length;
      const approvedS = filtSections.filter(s => s.status === 'approved').length;
      const openF = filtFindings.filter(f => f.status === 'open').length;
      const highF = filtFindings.filter(f => f.severity === 'high').length;
      const totalMisstatement = filtFindings.filter(f => f.finding_type === 'misstatement').reduce((s, f) => s + (Number(f.monetary_impact) || 0), 0);

      // Smart partner/supervisor lookup — actual signers preferred over org-role guess.
      // Falls back to the current authenticated user if nothing else matches (small
      // firms — almost always the partner is also generating the report).
      const partnerName    = findEngagementPartner(cm, sections, profiles, profilesRes, currentUser);
      const supervisorName = findSupervisor(sections, profiles, profilesRes);

      let html = '';

      // Firm name = the org name (e.g. "Millionaira"). Falls back to product name if absent.
      const firmName = (org.name || 'Audexon').toUpperCase();
      const docTypeLabel = reportType === 'planning'
        ? 'PLANNING MEMORANDUM (ISA 300)'
        : isExec
          ? 'AUDIT FILE (ISA 230)'
          : 'COMPLETION MEMORANDUM (ISA 700)';
      const yearEndLong  = eng.year_end_date ? formatDateLong(eng.year_end_date) : null;
      const generatedLong = formatDateLong(new Date().toISOString());

      // Cover stats vary by report type
      let coverStatsHtml;
      if (reportType === 'planning') {
        const sigRisks = risks.filter(r => r.is_significant).length;
        const linkedSet = new Set(riskLinks.map(l => l.risk_id));
        const unlinkedSigRisks = risks.filter(r => r.is_significant && !linkedSet.has(r.id)).length;
        const materialityLabel = eng.materiality_overall
          ? Number(eng.materiality_overall).toLocaleString()
          : 'Not set';
        coverStatsHtml = `
          <div class="cover-stat">
            <div class="lbl">Risks identified</div>
            <div class="val">${risks.length}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Significant risks</div>
            <div class="val">${sigRisks}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Unlinked (ISA 330.21)</div>
            <div class="val ${unlinkedSigRisks > 0 ? 'alert' : 'ok'}">${unlinkedSigRisks}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Overall materiality</div>
            <div class="val">${materialityLabel}</div>
          </div>
        `;
      } else if (isExec) {
        // Audit File cover — fieldwork facts, not the partner opinion.
        const mlCount = filtFindings.filter(f => f.is_management_letter_point).length;
        coverStatsHtml = `
          <div class="cover-stat">
            <div class="lbl">Sections</div>
            <div class="val">${filtSections.length}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Procedures done</div>
            <div class="val">${doneP} / ${totalP}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Sections approved</div>
            <div class="val ${approvedS === filtSections.length && filtSections.length > 0 ? 'ok' : ''}">${approvedS} / ${filtSections.length}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Open findings</div>
            <div class="val ${openF > 0 ? 'alert' : 'ok'}">${openF}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Adj. entries posted</div>
            <div class="val">${adjustingEntries.filter(a => a.is_posted).length} / ${adjustingEntries.length}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">ML points</div>
            <div class="val">${mlCount}</div>
          </div>
        `;
      } else {
        const opinion = cm?.opinion_type ? cm.opinion_type.replace(/_/g, ' ') : 'Not set';
        coverStatsHtml = `
          <div class="cover-stat">
            <div class="lbl">Opinion type</div>
            <div class="val">${esc(opinion).toUpperCase()}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Findings (open / total)</div>
            <div class="val ${openF > 0 ? 'alert' : 'ok'}">${openF} / ${filtFindings.length}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Adj. entries posted</div>
            <div class="val">${adjustingEntries.filter(a => a.is_posted).length} / ${adjustingEntries.length}</div>
          </div>
          <div class="cover-stat">
            <div class="lbl">Sections approved</div>
            <div class="val ${approvedS === filtSections.length && filtSections.length > 0 ? 'ok' : ''}">${approvedS} / ${filtSections.length}</div>
          </div>
        `;
      }

      html += `
        <div class="cover">
          <div class="cover-topbar">
            <div class="cover-firm">${esc(firmName)}</div>
            <div class="cover-confidential">CONFIDENTIAL</div>
          </div>
          <div class="cover-body">
            <div class="cover-type-label">${docTypeLabel}</div>
            <h1>${esc(eng.client_name)}</h1>
            <div class="cover-subtitle">${yearEndLong ? 'Year ended ' + yearEndLong : 'Year-end not set'}</div>
            <div class="cover-rule"></div>
            <dl class="cover-details">
              <dt>Engagement partner</dt>
              <dd${partnerName ? '' : ' class="muted"'}>${esc(partnerName || 'Not yet assigned')}</dd>
              <dt>File status</dt>
              <dd>${eng.status === 'completed' ? 'Closed' : 'Active'}${eng.closed_at ? ' — closed ' + formatDateLong(eng.closed_at) : ''}</dd>
              <dt>Report generated</dt>
              <dd>${generatedLong}</dd>
            </dl>
            <div class="cover-stats">${coverStatsHtml}</div>
          </div>
          <div class="cover-footer">
            <div>Generated by Audexon — ${esc(currentUser.email)}</div>
            <div>Confidential</div>
          </div>
        </div>
      `;

      // ===== 1B. ENGAGEMENT PLANNING WORKPAPERS (planning report only) =====
      // Client Acceptance / Continuance (ISA 220)
      if (reportType === 'planning' && eaccActive) {
        html += '<h2>Client Acceptance / Continuance (ISA 220)</h2>';
        const TYPE_LABELS = { initial: 'Initial acceptance', continuance: 'Annual continuance' };
        const DEC_LABELS = { accept: 'Accepted', accept_with_conditions: 'Accepted with conditions', decline: 'Declined' };
        const statusBadge = eaccActive.status === 'confirmed'
          ? '<span class="badge b-approved">CONFIRMED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody>
          <tr><th style="width:32%;">Type</th><td>${esc(TYPE_LABELS[eaccActive.acceptance_type] || eaccActive.acceptance_type || '—')}</td></tr>
          <tr><th>Decision</th><td>${esc(DEC_LABELS[eaccActive.decision] || eaccActive.decision || '—')} ${statusBadge}</td></tr>
          <tr><th>Decision date</th><td>${formatDateLong(eaccActive.decision_date) || '—'}</td></tr>
          <tr><th>Risk tier</th><td>${esc(eaccActive.risk_tier || '—')}</td></tr>
          ${eaccActive.conditions_summary ? `<tr><th>Conditions</th><td>${esc(eaccActive.conditions_summary)}</td></tr>` : ''}
          ${eaccActive.decision_rationale ? `<tr><th>Rationale</th><td>${esc(eaccActive.decision_rationale)}</td></tr>` : ''}
          ${eaccActive.integrity_conclusion ? `<tr><th>Integrity conclusion</th><td>${esc(eaccActive.integrity_conclusion)}</td></tr>` : ''}
          ${eaccActive.competence_resources_notes ? `<tr><th>Competence &amp; resources</th><td>${esc(eaccActive.competence_resources_notes)}</td></tr>` : ''}
        </tbody></table>`;

        // ISA 510 — opening balances
        if (eaccActive.opening_balances_status) {
          const OB_LABELS = {
            verified: 'Initial (first-year) engagement — ISA 510 approach planned; verified in fieldwork',
            na_continuance: 'Continuance — prior period audited by us, opening balances are prior closing',
          };
          html += `<h4>Opening balances (ISA 510)</h4>`;
          html += `<table><tbody>
            <tr><th style="width:32%;">Status</th><td>${esc(OB_LABELS[eaccActive.opening_balances_status] || eaccActive.opening_balances_status)}</td></tr>
            ${eaccActive.opening_balances_notes ? `<tr><th>Approach / notes</th><td style="white-space:pre-wrap;">${esc(eaccActive.opening_balances_notes)}</td></tr>` : ''}
          </tbody></table>`;
        }
      }

      // AML / KYC — Client Due Diligence (DNFBP)
      if (reportType === 'planning' && amlCdd) {
        const RR = { low: 'Low', medium: 'Medium', high: 'High' };
        const CL = { simplified: 'Simplified', standard: 'Standard', enhanced: 'Enhanced (EDD)' };
        const CC = { accept: 'Accept — CDD satisfactory', accept_edd: 'Accept with enhanced due diligence', decline: 'Decline / do not proceed' };
        const SR = { clear: 'Clear — no matches', hit_false_positive: 'Hit — false positive', hit_true_match: 'Hit — true match (EDD)' };
        const yn = (b) => b ? '&#10003;' : '&minus;';
        html += '<h2>AML / KYC — Client Due Diligence</h2>';
        html += '<table><tbody>';
        html += `<tr><th style="width:32%;">Status</th><td>${amlCdd.status === 'confirmed' ? '<span class="badge b-approved">CONFIRMED</span>' : '<span class="badge b-pending">DRAFT</span>'}</td></tr>`;
        if (amlCdd.cdd_date) html += `<tr><th>CDD date</th><td>${esc(formatDateLong(amlCdd.cdd_date) || '')}</td></tr>`;
        if (amlCdd.cdd_basis) html += `<tr><th>Engagement basis</th><td>${amlCdd.cdd_basis === 'continuance' ? 'Continuance (recurring client)' : 'Initial engagement'}${amlCdd.no_changes_confirmed ? ' &middot; no changes to identity/ownership confirmed' : ''}</td></tr>`;
        html += `<tr><th>Client legal name</th><td>${esc(amlCdd.client_legal_name || '—')}</td></tr>`;
        if (amlCdd.legal_form || amlCdd.registration_number) html += `<tr><th>Legal form / reg. no.</th><td>${esc(amlCdd.legal_form || '—')}${amlCdd.registration_number ? ' &middot; ' + esc(amlCdd.registration_number) : ''}</td></tr>`;
        if (amlCdd.country || amlCdd.business_activity) html += `<tr><th>Country / activity</th><td>${esc(amlCdd.country || '—')}${amlCdd.business_activity ? ' &middot; ' + esc(amlCdd.business_activity) : ''}</td></tr>`;
        if (amlCdd.license_evidence_url) html += `<tr><th>Trade licence — evidence</th><td><a href="${esc(amlCdd.license_evidence_url)}">link</a></td></tr>`;
        html += `<tr><th>Ownership structure understood</th><td>${yn(amlCdd.ownership_structure_understood)}${amlCdd.high_risk_jurisdiction ? ' &middot; <span style="color:#991B1B;">high-risk jurisdiction involved</span>' : ''}${amlCdd.ownership_evidence_url ? ' &middot; <a href="' + esc(amlCdd.ownership_evidence_url) + '">evidence</a>' : ''}</td></tr>`;
        html += `<tr><th>Screening performed</th><td>${yn(amlCdd.screening_performed)}${amlCdd.screening_date ? ' &middot; ' + esc(formatDateLong(amlCdd.screening_date) || '') : ''}${amlCdd.screening_source ? ' &middot; ' + esc(amlCdd.screening_source) : ''}</td></tr>`;
        if (amlCdd.screening_result) html += `<tr><th>Screening result</th><td>${esc(SR[amlCdd.screening_result] || amlCdd.screening_result)}${amlCdd.screening_evidence_url ? ' &middot; <a href="' + esc(amlCdd.screening_evidence_url) + '">evidence</a>' : ''}</td></tr>`;
        if (amlCdd.screening_results) html += `<tr><th>Reviewer comments</th><td style="white-space:pre-wrap;">${esc(amlCdd.screening_results)}</td></tr>`;
        if (amlCdd.pep_involved) html += `<tr><th>PEP involved</th><td>&#10003;${amlCdd.pep_notes ? ' &middot; ' + esc(amlCdd.pep_notes) : ''}</td></tr>`;
        html += `<tr><th>AML risk rating</th><td>${esc(RR[amlCdd.risk_rating] || '—')}${amlCdd.cdd_level ? ' &middot; CDD level: ' + esc(CL[amlCdd.cdd_level] || amlCdd.cdd_level) : ''}</td></tr>`;
        if (amlCdd.risk_rationale) html += `<tr><th>Risk rationale</th><td style="white-space:pre-wrap;">${esc(amlCdd.risk_rationale)}</td></tr>`;
        if (amlCdd.suspicious_activity_flag) html += `<tr><th>Suspicious activity</th><td>Flagged${amlCdd.suspicious_activity_notes ? ' &middot; ' + esc(amlCdd.suspicious_activity_notes) : ''}</td></tr>`;
        html += `<tr><th>Conclusion</th><td>${esc(CC[amlCdd.conclusion] || '—')}${amlCdd.conclusion_notes ? ' &middot; ' + esc(amlCdd.conclusion_notes) : ''}</td></tr>`;
        html += `<tr><th>Attestation</th><td>${amlCdd.attestation_made ? ('&#10003; ' + (amlCdd.attestation_date ? esc(formatDateLong(amlCdd.attestation_date) || '') : '')) : '&minus;'}</td></tr>`;
        html += '</tbody></table>';
        if (amlOwnersRpt.length) {
          html += '<h4>Beneficial owners</h4><table><thead><tr><th>Name</th><th style="text-align:right;">%</th><th>Nationality</th><th>PEP</th></tr></thead><tbody>';
          amlOwnersRpt.forEach(o => { html += `<tr><td>${esc(o.full_name || '—')}</td><td style="text-align:right;">${o.ownership_pct != null ? esc(String(o.ownership_pct)) : '—'}</td><td>${esc(o.nationality || '—')}</td><td>${o.is_pep ? 'Yes' : 'No'}</td></tr>`; });
          html += '</tbody></table>';
        }
      }

      // Engagement Letter (ISA 210)
      if (reportType === 'planning' && elActive) {
        html += '<h2>Engagement Letter (ISA 210)</h2>';
        const statusBadge = elActive.status === 'signed'
          ? '<span class="badge b-approved">SIGNED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td>${statusBadge}</td></tr>
          <tr><th>Letter date</th><td>${formatDateLong(elActive.letter_date) || '—'}</td></tr>
          <tr><th>Signed date</th><td>${formatDateLong(elActive.signed_date) || '—'}</td></tr>
          <tr><th>Client signatory</th><td>${esc(elActive.client_signatory_name || '—')}${elActive.client_signatory_role ? ' (' + esc(elActive.client_signatory_role) + ')' : ''}</td></tr>
          <tr><th>Reporting framework</th><td>${esc(elActive.reporting_framework || '—')}</td></tr>
          <tr><th>Audit period</th><td>${formatDateLong(elActive.audit_period_start) || '—'} to ${formatDateLong(elActive.audit_period_end) || '—'}</td></tr>
          ${elActive.file_name ? `<tr><th>Signed file</th><td>${esc(elActive.file_name)}${elActive.file_sha256 ? ' &middot; SHA-256: ' + elActive.file_sha256.slice(0,16) + '...' : ''}</td></tr>` : ''}
        </tbody></table>`;
        html += `<h4>ISA 210.10 minimum elements attested</h4>`;
        html += `<table><tbody>
          <tr><td style="width:80%;">Objective and scope of the audit</td><td style="text-align:center;">${elActive.isa_210_objective_scope ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Responsibilities of the auditor</td><td style="text-align:center;">${elActive.isa_210_auditor_responsibilities ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Responsibilities of management</td><td style="text-align:center;">${elActive.isa_210_mgmt_responsibilities ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Applicable financial reporting framework identified</td><td style="text-align:center;">${elActive.isa_210_framework_identified ? '&#10003;' : '&minus;'}</td></tr>
          <tr><td>Expected form and content of any reports</td><td style="text-align:center;">${elActive.isa_210_report_form_referenced ? '&#10003;' : '&minus;'}</td></tr>
        </tbody></table>`;

        // Reporting considerations (ISA 700 planning-side — 2-AI gap-closure item)
        if (elActive.expected_report_type || elActive.modification_risk_notes || elActive.report_delivery_target_date) {
          const REPORT_TYPE_LABELS = {
            unmodified: 'No modification anticipated',
            qualified:  'Possible qualification — modification risk',
            adverse:    'Possible adverse — major issue risk',
            disclaimer: 'Possible disclaimer — scope-limitation risk',
            unknown:    'To be assessed'
          };
          const typeLabel = REPORT_TYPE_LABELS[elActive.expected_report_type] || elActive.expected_report_type || '—';
          html += `<h4>Reporting considerations (ISA 700) <span style="font-weight:400;font-size:11px;color:#888;">— internal planning assumption, not a term of the letter</span></h4>`;
          html += `<table><tbody>
            <tr><th style="width:32%;">Anticipated report type</th><td>${esc(typeLabel)}</td></tr>
            ${elActive.report_delivery_target_date ? `<tr><th>Report delivery target</th><td>${formatDateLong(elActive.report_delivery_target_date) || '—'}</td></tr>` : ''}
            ${elActive.modification_risk_notes ? `<tr><th>Modification risk notes</th><td>${esc(elActive.modification_risk_notes)}</td></tr>` : ''}
          </tbody></table>`;
        }
      }

      // Independence & Ethics (ISA 220 R + IESBA)
      if (reportType === 'planning' && eiActive) {
        html += '<h2>Independence &amp; Ethics (ISA 220 R + IESBA)</h2>';
        const statusBadge = eiActive.status === 'confirmed'
          ? '<span class="badge b-approved">CONFIRMED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td>${statusBadge}</td></tr>
          <tr><th>Assessment date</th><td>${formatDateLong(eiActive.assessment_date) || '—'}</td></tr>
          <tr><th>Partner attestation</th><td>${eiActive.partner_attestation_made ? '&#10003; ' + (formatDateLong(eiActive.partner_attestation_date) || '') : '&minus;'}</td></tr>
          <tr><th>Fee % of firm total</th><td>${eiActive.fee_pct_of_firm_total != null ? eiActive.fee_pct_of_firm_total + '%' : '—'} ${eiActive.fee_dependence_band ? '<span class="badge b-' + (eiActive.fee_dependence_band === 'high' ? 'high' : 'medium') + '">' + eiActive.fee_dependence_band.toUpperCase() + '</span>' : ''}</td></tr>
          ${eiActive.fee_dependence_safeguards ? `<tr><th>Fee dependence safeguards</th><td>${esc(eiActive.fee_dependence_safeguards)}</td></tr>` : ''}
          ${eiActive.prior_year_fees_status ? `<tr><th>Prior-year fees</th><td>${esc({settled:'Settled before this year’s report', outstanding:'Outstanding — not fully settled', na_first_year:'N/A — first-year engagement'}[eiActive.prior_year_fees_status] || eiActive.prior_year_fees_status)}${eiActive.prior_year_fees_status === 'outstanding' ? ' <span class="badge b-high">THREAT</span>' : ''}</td></tr>` : ''}
          ${eiActive.prior_year_fees_note ? `<tr><th>Overdue-fee threat &amp; safeguard</th><td>${esc(eiActive.prior_year_fees_note)}</td></tr>` : ''}
          <tr><th>Partner tenure (years)</th><td>${eiActive.partner_tenure_years != null ? eiActive.partner_tenure_years : '—'} ${eiActive.partner_rotation_required ? '<span class="badge b-medium">ROTATION DUE</span>' : ''}</td></tr>
          ${eiActive.partner_rotation_action ? `<tr><th>Rotation action</th><td>${esc(eiActive.partner_rotation_action)}</td></tr>` : ''}
          <tr><th>Non-audit services</th><td>${eiActive.no_nas_provided ? 'No NAS provided' : (eiNas.length + ' service(s) recorded')}</td></tr>
          ${eiActive.overall_conclusion ? `<tr><th>Overall conclusion</th><td>${esc(eiActive.overall_conclusion)}</td></tr>` : ''}
        </tbody></table>`;
        // IESBA threats — only render rows that have meaningful content
        // (filtering avoids the 5-blank-rows look). Show threat category
        // explicitly even when null so the column has content.
        // Column names match the DB schema:
        //   engagement_independence_threats.threat_type  (NOT threat_category)
        //   engagement_independence_threats.present      (NOT identified)
        const THREAT_TYPE_LABELS = {
          self_interest: 'Self-interest', self_review: 'Self-review',
          advocacy: 'Advocacy', familiarity: 'Familiarity', intimidation: 'Intimidation'
        };
        const meaningfulThreats = (eiThreats || []).filter(t =>
          t.present
          || (t.description && t.description.trim())
          || (t.safeguards && t.safeguards.trim())
          || (t.conclusion && t.conclusion.trim())
        );
        if (meaningfulThreats.length > 0) {
          html += '<h4>IESBA threats assessed</h4>';
          html += '<table><thead><tr><th>Threat category</th><th>Present?</th><th>Description</th><th>Safeguards</th><th>Conclusion</th></tr></thead><tbody>';
          meaningfulThreats.forEach(t => {
            const catLabel = THREAT_TYPE_LABELS[t.threat_type]
              || (t.threat_type ? t.threat_type.replace(/_/g,' ') : 'Unspecified');
            html += `<tr><td>${esc(catLabel)}</td><td style="text-align:center;">${t.present ? '&#10003;' : '&minus;'}</td><td>${esc(t.description || '—')}</td><td>${esc(t.safeguards || '—')}</td><td>${esc(t.conclusion || '—')}</td></tr>`;
          });
          html += '</tbody></table>';
        }
        // Non-audit services — engagement_nas schema:
        //   service_type (NOT service_description), description, threat_category,
        //   safeguards, conclusion, is_prohibited (NOT is_permitted), service_provider
        // No fee_amount column in this table — partner-relevant fact is whether
        // the service was prohibited per IESBA and what the threat category is.
        const NAS_TYPE_LABELS = {
          bookkeeping: 'Bookkeeping', tax: 'Tax', valuation: 'Valuation',
          it: 'IT', payroll: 'Payroll', other: 'Other'
        };
        const meaningfulNas = (eiNas || []).filter(n =>
          (n.service_type && n.service_type.trim())
          || (n.description && n.description.trim())
        );
        if (meaningfulNas.length > 0) {
          html += '<h4>Non-audit services</h4>';
          html += '<table><thead><tr><th>Service</th><th>Description</th><th>Threat</th><th>Prohibited?</th><th>Safeguards</th></tr></thead><tbody>';
          meaningfulNas.forEach(n => {
            const typeLabel = NAS_TYPE_LABELS[n.service_type] || (n.service_type ? n.service_type.replace(/_/g,' ') : '—');
            const threatLabel = THREAT_TYPE_LABELS[n.threat_category] || (n.threat_category ? n.threat_category.replace(/_/g,' ') : '—');
            const prohibitedCell = n.is_prohibited
              ? '<span style="color:#991B1B; font-weight:600;">&#10003; Prohibited</span>'
              : '<span style="color:#15803D;">&minus;</span>';
            html += `<tr><td>${esc(typeLabel)}</td><td>${esc(n.description || '—')}</td><td>${esc(threatLabel)}</td><td style="text-align:center;">${prohibitedCell}</td><td>${esc(n.safeguards || '—')}</td></tr>`;

          html += '</tbody></table>';
