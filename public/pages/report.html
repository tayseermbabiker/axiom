      }

      // Audit Planning (ISA 300 strategy + ISA 315 understanding + ISA 220 R direction)
      if (reportType === 'planning' && easActive) {
        html += '<h2>Audit Planning (ISA 300 + ISA 315)</h2>';
        const statusBadge = easActive.status === 'approved'
          ? '<span class="badge b-approved">APPROVED</span>'
          : '<span class="badge b-pending">DRAFT</span>';
        html += `<table><tbody><tr><th style="width:32%;">Status</th><td>${statusBadge} ${easActive.approved_at ? '&middot; ' + formatDateLong(easActive.approved_at) : ''}</td></tr></tbody></table>`;
        const narrSection = (label, val) => val
          ? `<h4>${esc(label)}</h4><div style="font-size:11px; color:#374151; white-space:pre-wrap; margin-bottom:12px; line-height:1.6;">${esc(val)}</div>`
          : '';
        html += narrSection('1. Characteristics defining scope (ISA 300.9(a))',         easActive.scope_characteristics);
        html += narrSection('2. Reporting objectives, timing & communications (300.9(b))', easActive.reporting_objectives);
        html += narrSection('3. Significant factors directing the team (300.9(c))',     easActive.significant_factors);
        html += narrSection('4. Results of preliminary engagement activities (300.9(d))', easActive.preliminary_activities_summary);
        html += narrSection('5. Nature, timing & extent of resources (300.9(e))',       easActive.resources_plan);
        html += narrSection('Partner direction, supervision & review (ISA 220 R)',      easActive.partner_direction_plan);
        if (easActive.team_composition || easActive.specialists_involved || easActive.budgeted_hours || easActive.eqr_required) {
          html += '<h4>Team, specialists, EQR</h4>';
          html += '<table><tbody>';
          if (easActive.team_composition)     html += `<tr><th style="width:32%;">Team composition</th><td>${esc(easActive.team_composition)}</td></tr>`;
          if (easActive.specialists_involved) html += `<tr><th>Specialists</th><td>${esc(easActive.specialists_involved)}</td></tr>`;
          html += `<tr><th>EQR required</th><td>${easActive.eqr_required ? '&#10003; Yes — ' + esc(easActive.eqr_reviewer_name || '(reviewer not named)') : '&minus; No'}</td></tr>`;
          if (easActive.budgeted_hours)       html += `<tr><th>Budgeted hours</th><td>${easActive.budgeted_hours}</td></tr>`;
          html += '</tbody></table>';
        }
        // Per-member budget breakdown (reviewer #5b)
        if (budgetRpt.length) {
          let th = 0, tc = 0;
          html += '<h4>Budget by team member</h4>';
          html += '<table><thead><tr><th>Team member</th><th>Grade</th><th style="text-align:right;">Hours</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Cost</th></tr></thead><tbody>';
          budgetRpt.forEach(b => {
            const hrs = Number(b.budgeted_hours) || 0; const rate = Number(b.hourly_rate) || 0; const cost = hrs * rate;
            th += hrs; tc += cost;
            html += `<tr><td>${esc(b.member_name || '—')}</td><td>${esc(b.grade || '—')}</td><td style="text-align:right;">${hrs || '—'}</td><td style="text-align:right;">${rate ? rate.toLocaleString() : '—'}</td><td style="text-align:right;">${cost ? cost.toLocaleString(undefined, { minimumFractionDigits: 2 }) : '—'}</td></tr>`;
          });
          html += `<tr style="background:#F5F7FA; font-weight:700;"><td colspan="2">Total</td><td style="text-align:right;">${th}</td><td></td><td style="text-align:right;">${tc ? tc.toLocaleString(undefined, { minimumFractionDigits: 2 }) : '—'}</td></tr>`;
          html += '</tbody></table>';
        }
        // ISA-specific planning narratives (gap-closure items from 2-AI synthesis)
        html += narrSection('Internal controls overview (ISA 315.12-26)',         easActive.internal_controls_overview);
        html += narrSection('Planning analytics (ISA 315.6)',                     easActive.planning_analytics_note);
        html += narrSection('Going concern — planning assessment (ISA 570)',      easActive.going_concern_planning_note);
        html += narrSection('Subsequent events — planning approach (ISA 560)',    easActive.subsequent_events_planning_note);

        // ISA 315 — Understanding the entity (Sprint 4 standards floor)
        html += narrSection('Nature of business & operations (ISA 315.19(a))',    easActive.entity_business_model);
        html += narrSection('Ownership & governance (ISA 315.19(a))',             easActive.entity_ownership_governance);
        html += narrSection('Locations / branches / components',                  easActive.entity_locations);
        html += narrSection('IT environment & key systems (ISA 315.19(a))',       easActive.entity_it_environment);
        html += narrSection('Objectives, strategies & business risks (ISA 315.19(a))', easActive.entity_objectives_strategies);
        html += narrSection('Measures to assess financial performance (ISA 315.19(c))', easActive.entity_performance_measures);
        html += narrSection('Industry & external environment (ISA 315.19(a))',    easActive.industry_external_environment);
        html += narrSection('Significant changes since prior period (ISA 315.A47)', easActive.significant_changes_from_prior_year);
        // ISA 260 + ISA 250 polish (Perplexity 2026-05-24)
        html += narrSection('Key laws & regulations considered (ISA 250)',         easActive.key_laws_regulations);
        html += narrSection('Planned communications with mgmt & TCWG (ISA 260)',   easActive.planned_communications_mgmt_tcwg);
        // ISA 315.14 — risk assessment procedures performed
        const isa315Any = easActive.isa_315_inquiry_performed
                       || easActive.isa_315_analytical_performed
                       || easActive.isa_315_observation_inspection_performed;
        if (isa315Any || easActive.status === 'approved') {
          html += '<h4>Risk assessment procedures performed (ISA 315.14)</h4>';
          html += '<table><tbody>';
          html += `<tr><td style="width:80%;">Inquiries of management, TCWG, and others (ISA 315.14(a))</td><td style="text-align:center;">${easActive.isa_315_inquiry_performed ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>Analytical procedures as risk assessment (ISA 315.14(b))</td><td style="text-align:center;">${easActive.isa_315_analytical_performed ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>Observation and inspection (ISA 315.14(c))</td><td style="text-align:center;">${easActive.isa_315_observation_inspection_performed ? '&#10003;' : '&minus;'}</td></tr>`;
          html += '</tbody></table>';
        }

        // Fraud team discussion (ISA 240.17) — render the structured fields
        if (easActive.fraud_team_discussion_held || easActive.fraud_team_discussion_date || easActive.fraud_team_discussion_attendees) {
          html += '<h4>Fraud team discussion (ISA 240.17)</h4>';
          html += '<table><tbody>';
          html += `<tr><th style="width:32%;">Discussion held</th><td>${easActive.fraud_team_discussion_held ? '<span class="chip chip-green">Yes</span>' : '<span class="chip chip-red">No — required by ISA 240.17</span>'}</td></tr>`;
          if (easActive.fraud_team_discussion_date)     html += `<tr><th>Date</th><td>${formatDateLong(easActive.fraud_team_discussion_date) || '—'}</td></tr>`;
          if (easActive.fraud_team_discussion_attendees) html += `<tr><th>Attendees</th><td>${esc(easActive.fraud_team_discussion_attendees)}</td></tr>`;
          html += '</tbody></table>';
        }
      }

      // PBC — Prepared-By-Client requests (ISA 300/500 IPTE)
      if (reportType === 'planning' && pbcRpt.length) {
        const PBC_ST = { outstanding: 'Outstanding', requested: 'Requested', received: 'Received', under_review: 'Under review', accepted: 'Accepted', waived: 'Waived' };
        const open = pbcRpt.filter(i => i.status === 'outstanding' || i.status === 'requested').length;
        html += '<h2>PBC — Prepared-By-Client requests</h2>';
        html += `<p style="font-size:12px; color:#5b7186;">${pbcRpt.length} items &middot; ${open} outstanding. Client-provided information (ISA 500 IPTE).</p>`;
        html += '<table><thead><tr><th>Item</th><th>Area</th><th>Priority</th><th>Due</th><th>Status</th><th>Received</th><th>IPTE</th></tr></thead><tbody>';
        pbcRpt.forEach(i => {
          html += `<tr><td>${esc(i.description || '—')}</td><td>${esc(i.audit_area || '—')}</td><td>${esc(i.priority || '—')}</td><td>${i.due_date ? esc(formatDateLong(i.due_date) || '') : '—'}</td><td>${esc(PBC_ST[i.status] || i.status || '—')}</td><td>${i.received_date ? esc(formatDateLong(i.received_date) || '') : '—'}</td><td style="text-align:center;">${i.ipte_checked ? '&#10003;' : '&minus;'}</td></tr>`;
        });
        html += '</tbody></table>';
      }

      // ===== 2. MATERIALITY (ISA 320) — versioned workpaper =====
      // Renders from the versioned table (matActive) when available, falling
      // back to engagements.materiality_* (legacy snapshot). Both reports
      // show materiality. Completion report adds the planning-vs-revised
      // comparison if matIsRevised.
      const BENCH_LABELS = { pbt: 'Profit Before Tax', revenue: 'Revenue', assets: 'Total Assets', equity: 'Equity', other: 'Other' };
      const BENCH_REASON_LABELS = {
        profit_based: 'Profit-based entity', asset_based: 'Asset-based entity',
        revenue_driven: 'Revenue-driven entity', volatile_profits: 'Volatile profits', other: 'Other'
      };
      const PERIOD_LABELS = { current: 'Current period', normalized: 'Normalized / averaged', prior: 'Prior period', other: 'Other' };
      const PERF_REASON_LABELS = {
        no_history: 'No history of misstatements', prior_misstatements: 'Prior year had significant misstatements',
        first_year: 'First-year audit', other: 'Other'
      };
      const fmtMat = (n) => n != null ? Number(n).toLocaleString(undefined, { minimumFractionDigits: 0 }) : '—';

      if (matActive || eng.materiality_overall) {
        // Planning report shows v1 (planning materiality, locked at planning).
        // Completion report shows v_active (revised, if any). The
        // planning-vs-revised comparison block at the bottom is gated to
        // reportType === 'completion'.
        const sourceVersion = reportType === 'planning'
          ? (matPlanning || matActive)
          : (matActive || matPlanning);
        const v = sourceVersion || {
          benchmark: eng.materiality_benchmark,
          benchmark_amount: eng.materiality_amount,
          percentage_applied: eng.materiality_pct,
          overall_materiality: eng.materiality_overall,
          performance_materiality_pct: eng.materiality_perf_pct,
          performance_materiality_amount: eng.materiality_performance,
          trivial_pct: eng.materiality_trivial_pct,
          trivial_amount: eng.materiality_trivial,
          rationale: eng.materiality_rationale,
          status: 'approved',
        };
        const benchLabel = BENCH_LABELS[v.benchmark] || v.benchmark_other_label || v.benchmark || '—';
        const statusBadge = v.status === 'approved'
          ? `<span class="chip chip-green">Approved${v.approved_at ? ' &middot; ' + formatDateLong(v.approved_at) : ''}</span>`
          : `<span class="chip chip-grey">Draft</span>`;
        // Revised badge only on COMPLETION report; planning report shows v1 as-was.
        const revisedBadge = (reportType === 'completion' && matIsRevised)
          ? `<span class="chip chip-blue" style="margin-left:6px;">Revised v${matAllVersions.length}</span>`
          : '';
        // On planning report when revised, show a small note pointing to completion
        const planningRevisionNote = (reportType === 'planning' && matIsRevised)
          ? `<p style="font-size:11px; color:#92400E; margin-top:8px; padding:6px 10px; background:#FFFBEB; border-left:3px solid #92400E;">Note: this materiality was revised on ${formatDateLong(matActive.approved_at) || ''} (v${matAllVersions.length}). The Completion Memorandum shows the revised figures and the audit-strategy reassessment record per ISA 320.12-13.</p>`
          : '';

        html += '<h2>Materiality (ISA 320)</h2>';
        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td>${statusBadge}${revisedBadge}</td></tr>
          <tr><th>Benchmark</th><td>${esc(benchLabel)}${v.benchmark_period && v.benchmark_period !== 'current' ? ' <span class="chip chip-amber" style="margin-left:6px;">' + esc(PERIOD_LABELS[v.benchmark_period] || v.benchmark_period) + '</span>' : ''}</td></tr>
          ${v.benchmark_selection_reason ? `<tr><th>Reason for benchmark</th><td>${esc(BENCH_REASON_LABELS[v.benchmark_selection_reason] || v.benchmark_selection_reason)}${v.benchmark_selection_other_text ? ' &mdash; ' + esc(v.benchmark_selection_other_text) : ''}</td></tr>` : ''}
          <tr><th>Benchmark amount</th><td>${fmtMat(v.benchmark_amount)}</td></tr>
          <tr><th>Percentage applied</th><td>${v.percentage_applied}%</td></tr>
          <tr><th><strong>Overall materiality</strong></th><td><strong>${fmtMat(v.overall_materiality)}</strong></td></tr>
          <tr><th>Performance materiality (${v.performance_materiality_pct || 75}%)</th><td>${fmtMat(v.performance_materiality_amount)}${v.performance_materiality_reason ? ' &mdash; ' + esc(PERF_REASON_LABELS[v.performance_materiality_reason] || v.performance_materiality_reason) : ''}</td></tr>
          <tr><th>Clearly trivial threshold (${v.trivial_pct || 5}%)</th><td>${fmtMat(v.trivial_amount)}</td></tr>
          ${v.benchmark_period_reason ? `<tr><th>Reason for non-current period</th><td>${esc(v.benchmark_period_reason)}</td></tr>` : ''}
        </tbody></table>`;

        // Qualitative considerations checklist (ISA 320.A1) — read from sourceVersion
        if (sourceVersion && sourceVersion.id) {
          const qualItems = [
            [v.qual_regulatory_sensitivity,    'Regulatory sensitivity'],
            [v.qual_covenant_compliance,       'Covenant compliance'],
            [v.qual_fraud_risk_indicators,     'Fraud risk indicators'],
            [v.qual_sensitive_disclosures,     'Sensitive disclosures (related parties etc.)'],
            [v.qual_mgmt_compensation_impact,  'Management compensation impact'],
            [v.qual_key_ratios_trends,         'Key ratios / trends'],
          ];
          const anyQual = qualItems.some(([on]) => on) || v.qual_other_text;
          if (anyQual) {
            html += '<h4>Qualitative considerations (ISA 320.A1)</h4>';
            html += '<table><tbody>';
            qualItems.forEach(([on, label]) => {
              if (on) html += `<tr><td style="width:90%;">${esc(label)}</td><td style="text-align:center;">&#10003;</td></tr>`;
            });
            if (v.qual_other_text) {
              html += `<tr><td>Other: ${esc(v.qual_other_text)}</td><td style="text-align:center;">&#10003;</td></tr>`;
            }
            html += '</tbody></table>';
          }
        }

        // Specific materiality (ISA 320.10) — filter items to the sourceVersion
        const versionSpecificItems = sourceVersion && sourceVersion.id
          ? matAllItems.filter(it => it.materiality_version_id === sourceVersion.id)
          : [];
        if (sourceVersion && sourceVersion.id && v.has_specific_materiality && versionSpecificItems.length > 0) {
          html += '<h4>Specific materiality (ISA 320.10)</h4>';
          html += '<table><thead><tr><th>Class / account / disclosure</th><th style="text-align:right;">Amount</th><th>Rationale</th></tr></thead><tbody>';
          versionSpecificItems.forEach(it => {
            html += `<tr><td>${esc(it.class_or_account)}</td><td style="text-align:right;">${fmtMat(it.specific_amount)}</td><td>${esc(it.rationale || '—')}</td></tr>`;
          });
          html += '</tbody></table>';
        }

        if (v.rationale) {
          html += `<div style="background:#F5F7FA; border-left:3px solid #1A3A5F; padding:10px 14px; margin-bottom:16px; font-size:12px;">
            <div style="font-size:9px; font-weight:700; color:#1A3A5F; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;">Rationale (ISA 320)</div>
            ${esc(v.rationale)}
          </div>`;
        }

        // On the Planning report, when materiality was later revised, surface a
        // small breadcrumb pointing to the Completion Memorandum (where the
        // revised figures live).
        if (planningRevisionNote) html += planningRevisionNote;

        // Completion report: show planning vs revised comparison if revised
        if (reportType === 'completion' && matIsRevised && matPlanning) {
          html += '<h4>Planning vs revised materiality (ISA 320.12)</h4>';
          html += `<table><thead><tr><th>Item</th><th style="text-align:right;">Planning (v1)</th><th style="text-align:right;">Revised (v${matAllVersions.length})</th><th style="text-align:right;">Change</th></tr></thead><tbody>`;
          const compareRow = (label, planVal, currVal) => {
            const delta = (planVal != null && currVal != null) ? currVal - planVal : null;
            const deltaStr = delta == null ? '—' : (delta > 0 ? '+' : '') + fmtMat(delta);
            const deltaColor = delta == null ? '#9ca3af' : (delta > 0 ? '#15803D' : (delta < 0 ? '#991B1B' : '#374151'));
            return `<tr><td>${label}</td><td style="text-align:right;">${fmtMat(planVal)}</td><td style="text-align:right; font-weight:600;">${fmtMat(currVal)}</td><td style="text-align:right; color:${deltaColor};">${deltaStr}</td></tr>`;
          };
          html += compareRow('Overall materiality',     matPlanning.overall_materiality,            matActive.overall_materiality);
          html += compareRow('Performance materiality', matPlanning.performance_materiality_amount, matActive.performance_materiality_amount);
          html += compareRow('Trivial threshold',       matPlanning.trivial_amount,                 matActive.trivial_amount);
          html += '</tbody></table>';
          if (matActive.reason_for_revision) {
            html += `<div style="background:#FFFBEB; border-left:3px solid #92400E; padding:10px 14px; margin-bottom:16px; font-size:12px;">
              <div style="font-size:9px; font-weight:700; color:#92400E; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;">Reason for revision (ISA 320.12)</div>
              ${esc(matActive.reason_for_revision)}
            </div>`;
          }
          if (matActive.strategy_reviewed_on_revision) {
            html += `<p style="font-size:11px; color:#15803D; margin-bottom:12px;">&#10003; Audit strategy reviewed following materiality revision (ISA 320.13)${matActive.strategy_reviewed_date ? ' on ' + formatDateLong(matActive.strategy_reviewed_date) : ''}.</p>`;
          }
        }
      }

      // ===== 2B. RISK ASSESSMENT (ISA 315 + ISA 330 + ISA 240) =====
      // Planning: full register + matrix. Completion: brief recap only.
      if (reportType === 'planning' && (risks.length > 0 || riskAssess)) {
        html += '<h2>Risk Assessment (ISA 315 / ISA 330)</h2>';

        const ASSERT_LABELS = {
          existence:'Existence', completeness:'Completeness', accuracy:'Accuracy',
          valuation:'Valuation', cutoff:'Cut-off', classification:'Classification',
          rights_obligations:'Rights & obligations', presentation:'Presentation'
        };
        const SRC_LABELS = {
          entity:'Entity', industry:'Industry', it:'IT', fraud:'Fraud',
          management_override:'Mgmt override', rap:'RAP', other:'Other'
        };

        // Header summary
        const sigCount = risks.filter(r => r.is_significant).length;
        const linkedIds = new Set(riskLinks.map(l => l.risk_id));
        const linkedRiskCount = risks.filter(r => linkedIds.has(r.id)).length;
        const unlinkedSig = risks.filter(r => r.is_significant && !linkedIds.has(r.id)).length;
        const assessBadge = riskAssess && riskAssess.status === 'confirmed'
          ? `<span class="badge b-approved">CONFIRMED ${riskAssess.confirmed_at ? '&middot; ' + formatDateLong(riskAssess.confirmed_at) : ''}</span>`
          : `<span class="badge b-pending">DRAFT</span>`;
        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td>${assessBadge}</td></tr>
          <tr><th>Total risks identified</th><td>${risks.length}</td></tr>
          <tr><th>Significant risks</th><td>${sigCount}</td></tr>
          <tr><th>Risks with linked procedures</th><td>${linkedRiskCount} / ${risks.length}</td></tr>
          ${unlinkedSig > 0 ? `<tr><th>Unlinked significant risks</th><td style="color:#991B1B;font-weight:600;">${unlinkedSig} (ISA 330.21 violation)</td></tr>` : ''}
        </tbody></table>`;

        // Pivot matrix (sections × assertions)
        const assertionKeys = Object.keys(ASSERT_LABELS);
        const sectionsWithRisks = sections.filter(s => risks.some(r => r.section_id === s.id));
        if (sectionsWithRisks.length > 0) {
          html += '<h3>Risk matrix (sections &times; assertions)</h3>';
          html += '<table style="font-size:10px;"><thead><tr><th>Section</th>';
          assertionKeys.forEach(a => { html += `<th style="text-align:center;">${esc(ASSERT_LABELS[a])}</th>`; });
          html += '</tr></thead><tbody>';
          sectionsWithRisks.forEach(s => {
            html += `<tr><td>${esc(s.name)}</td>`;
            assertionKeys.forEach(a => {
              const cell = risks.filter(r => r.section_id === s.id && r.assertion === a);
              const sig = cell.filter(r => r.is_significant).length;
              if (!cell.length) {
                html += `<td style="text-align:center; color:#9ca3af;">&middot;</td>`;
              } else {
                html += `<td style="text-align:center; font-weight:600; ${sig ? 'background:#FEF9C3; color:#A16207;' : ''}">${cell.length}${sig ? ' (' + sig + ')' : ''}</td>`;
              }
            });
            html += '</tr>';
          });
          html += '</tbody></table>';
          html += '<p style="font-size:10px; color:#6b7280; margin:4px 0 14px;">Cells show risks identified; gold &amp; bold = significant risk count in brackets.</p>';
        }

        // Risk register grouped by section
        html += '<h3>Risk register</h3>';
        const risksBySection = {};
        risks.forEach(r => {
          if (!risksBySection[r.section_id]) risksBySection[r.section_id] = [];
          risksBySection[r.section_id].push(r);
        });
        sections.filter(s => risksBySection[s.id]).forEach(s => {
          html += `<h4>${esc(s.name)}</h4>`;
          // Each risk uses its own <tbody class="risk-group"> so the risk
          // row + overall-response row never split mid-content across pages.
          html += '<table><thead><tr><th>Risk</th><th>Assertion</th><th>Source</th><th>I</th><th>C</th><th>=</th><th>Sig?</th><th>Linked procs</th></tr></thead>';
          risksBySection[s.id].forEach(r => {
            const linkedProcCount = riskLinks.filter(l => l.risk_id === r.id).length;
            const sigCell = r.is_significant
              ? '<span style="color:#A16207; font-weight:700;">&#9733; Yes</span>'
              : '&minus;';
            const presumedBadge = r.is_locked_presumed ? ' <span class="badge b-medium" style="font-size:8px;">PRESUMED</span>' : '';
            const rebuttedNote = r.presumption_rebutted
              ? `<div style="font-size:9px; color:#065F46; margin-top:3px;"><em>Rebutted (ISA 240.26): ${esc(r.rebuttal_rationale || '')}</em></div>`
              : '';
            html += '<tbody class="risk-group">';
            html += `<tr>
              <td>${esc(r.risk_description)}${presumedBadge}${rebuttedNote}</td>
              <td>${esc(ASSERT_LABELS[r.assertion] || r.assertion)}</td>
              <td>${esc(SRC_LABELS[r.source] || r.source)}</td>
              <td style="text-align:center;">${r.inherent_rating[0].toUpperCase()}</td>
              <td style="text-align:center;">${r.control_rating[0].toUpperCase()}</td>
              <td style="text-align:center; font-weight:600;">${r.combined_rating[0].toUpperCase()}</td>
              <td style="text-align:center;">${sigCell}</td>
              <td style="text-align:center; ${r.is_significant && linkedProcCount === 0 ? 'color:#991B1B; font-weight:700;' : ''}">${linkedProcCount}</td>
            </tr>`;
            if (r.is_significant && r.overall_response) {
              html += `<tr><td colspan="8" style="background:#FFFBEB; font-size:10px;"><strong>Overall response (ISA 330.5):</strong> ${esc(r.overall_response)}</td></tr>`;
            }
            html += '</tbody>';
          });
          html += '</table>';
        });

        // Controls & reliance (ISA 315 D&I / ISA 330 / ISA 500)
        html += '<h3>Controls &amp; reliance (ISA 315 D&amp;I)</h3>';
        if (!controls.length) {
          html += '<p style="font-size:11px; color:#374151; margin:4px 0 14px;">No reliance on controls &mdash; substantive approach throughout. The design &amp; implementation of controls relevant to the audit was considered; no controls were identified for reliance, so a fully substantive response was planned (ISA 315 / ISA 330).</p>';
        } else {
          const CTRL_TYPE = { manual:'Manual', automated:'Automated', itgc:'ITGC' };
          const CTRL_DSGN = { effective:'Design effective', deficient:'Design deficient', not_applicable:'Design N/A' };
          const CTRL_IMPL = { implemented:'Implemented', not_implemented:'Not implemented' };
          const CTRL_RELY = { no_reliance:'No reliance', rely:'Rely', combined:'Combined' };
          html += '<table style="font-size:10px;"><thead><tr><th>Control</th><th>Type</th><th>D&amp;I conclusion</th><th>Reliance</th><th>Addresses risk</th></tr></thead><tbody>';
          controls.forEach(c => {
            const risk = c.risk_id ? risks.find(r => r.id === c.risk_id) : null;
            const riskLabel = risk
              ? esc(risk.risk_description.slice(0,60)) + (risk.risk_description.length > 60 ? '&hellip;' : '')
              : (c.risk_id ? '<span style="color:#991B1B;">risk deleted</span>' : '&minus;');
            const di = [c.design_conclusion ? CTRL_DSGN[c.design_conclusion] : null,
                        c.implementation ? CTRL_IMPL[c.implementation] : null].filter(Boolean).join(' &middot; ') || '&minus;';
            const relyCell = c.reliance_decision === 'no_reliance'
              ? CTRL_RELY[c.reliance_decision]
              : '<strong style="color:#A16207;">' + CTRL_RELY[c.reliance_decision] + '</strong>';
            html += `<tr>
              <td>${esc(c.control_ref)}${c.process_cycle ? '<div style="color:#6b7280;">' + esc(c.process_cycle) + (c.assertions ? ' &middot; ' + esc(c.assertions) : '') + '</div>' : ''}${c.ipte_relied ? '<div style="color:#854D0E; font-size:9px;">IPTE assessed (ISA 500)</div>' : ''}</td>
              <td>${CTRL_TYPE[c.control_type] || esc(c.control_type)}</td>
              <td>${di}</td>
              <td style="text-align:center;">${relyCell}</td>
              <td>${riskLabel}</td>
            </tr>`;
          });
          html += '</tbody></table>';
          if (controls.some(c => c.reliance_decision !== 'no_reliance')) {
            html += '<p style="font-size:10px; color:#854D0E; margin:4px 0 14px;">Where reliance is taken, operating-effectiveness tests of controls (ISA 330.8) and the sampling methodology are documented separately in the file evidence.</p>';
          }
        }

        // Attestations summary
        if (riskAssess) {
          html += '<h4>Risk assessment attestations</h4>';
          html += '<table><tbody>';
          html += `<tr><td style="width:80%;">Risks assessed at assertion level (ISA 315.27)</td><td style="text-align:center;">${riskAssess.isa_315_27_assertions_assessed ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>Significant risks identified per professional judgement (ISA 315.28)</td><td style="text-align:center;">${riskAssess.isa_315_28_significant_risks_identified ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>Stand-back consideration of unflagged CoTABDs (ISA 315.A114)</td><td style="text-align:center;">${riskAssess.isa_315_stand_back_completed ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>All significant risks linked to responsive procedures (ISA 330.21)</td><td style="text-align:center;">${riskAssess.isa_330_responses_linked ? '&#10003;' : '&minus;'}</td></tr>`;
          html += `<tr><td>Controls D&amp;I evaluated and reliance decision documented (ISA 315)</td><td style="text-align:center;">${riskAssess.isa_315_controls_di_concluded ? '&#10003;' : '&minus;'}</td></tr>`;
          html += '</tbody></table>';
        }
      }

      // ===== 2C. RISK ASSESSMENT RECAP (completion report only) =====
      if (reportType === 'completion' && (risks.length > 0 || riskAssess)) {
        const sigCt = risks.filter(r => r.is_significant).length;
        const linkedSet = new Set(riskLinks.map(l => l.risk_id));
        const unlinkedSig = risks.filter(r => r.is_significant && !linkedSet.has(r.id)).length;
        const assessLabel = riskAssess?.status === 'confirmed' ? 'Confirmed' : 'Draft';
        html += '<h2>Risk Assessment Recap (ISA 315 / ISA 330)</h2>';
        html += `<p style="font-size:11px; color:#6E6E73; margin-bottom:10px;">High-level recap of the risk assessment finalised during planning. The full register and matrix are in the Planning Memorandum.</p>`;
        html += `<table><tbody>
          <tr><th style="width:32%;">Assessment status</th><td>${statusChip(assessLabel)}</td></tr>
          <tr><th>Total risks identified</th><td>${risks.length}</td></tr>
          <tr><th>Significant risks</th><td>${sigCt}</td></tr>
          <tr><th>Unlinked significant risks (ISA 330.21)</th><td>${unlinkedSig > 0 ? '<span class="chip chip-red">' + unlinkedSig + ' violation' + (unlinkedSig > 1 ? 's' : '') + '</span>' : statusChip('done')}</td></tr>
        </tbody></table>`;
      }

      // ===== 3. FINDINGS & MISSTATEMENTS SUMMARY (completion + audit file) =====
      if (showFindingsTbMl) {
      html += '<h2>Summary of Findings</h2>';
      if (filtFindings.length === 0) {
        html += '<p class="no-data">No findings recorded.</p>';
      } else {
        // Auto-derive ISA reference from finding_type — inspectors expect to
        // see which ISA each finding implicates. Override path available in
        // the future via a per-finding isa_reference column if needed.
        const ISA_REF_BY_TYPE = {
          misstatement:        'ISA 450',
          control_deficiency:  'ISA 265',
          observation:         'ISA 230',
        };
        html += '<table><thead><tr><th>Finding Title</th><th>Section</th><th>Type</th><th>ISA Ref</th><th>Severity</th><th>Status</th><th>ML</th><th>Adj.</th><th>Adj. Entry Status</th></tr></thead><tbody>';
        html += filtFindings.map(f => {
          const secName = sections.find(s => s.id === f.section_id)?.name || '—';
          const fAdj = adjustingEntries.filter(a => a.finding_id === f.id);
          const hasAdj = fAdj.length > 0;
          const adjStatus = hasAdj ? (fAdj.every(a => a.is_posted) ? 'Posted' : 'Not Posted') : '';
          const isaRef = f.isa_reference || ISA_REF_BY_TYPE[f.finding_type] || '—';
          return `<tr>
            <td>${esc(f.title)}</td>
            <td>${esc(secName)}</td>
            <td>${(f.finding_type || 'observation').replace(/_/g, ' ')}</td>
            <td style="font-size:10px; color:#4B5563; font-weight:600;">${esc(isaRef)}</td>
            <td><span style="color:${f.severity === 'high' ? '#991B1B' : f.severity === 'medium' ? '#92400E' : '#4B5563'};font-weight:600;">${f.severity.toUpperCase()}</span></td>
            <td><span style="color:${f.status === 'open' ? '#92400E' : f.status === 'resolved' ? '#065F46' : '#1E40AF'};font-weight:600;">${f.status.toUpperCase()}</span></td>
            <td>${f.is_management_letter_point ? 'Yes' : ''}</td>
            <td>${hasAdj ? 'Yes' : 'No'}</td>
            <td>${adjStatus ? `<span style="color:${adjStatus === 'Posted' ? '#065F46' : '#92400E'};font-weight:600;">${adjStatus.toUpperCase()}</span>` : ''}</td>
          </tr>`;
        }).join('');
        html += '</tbody></table>';
      }

      // ===== ISA 450 — Consolidated misstatement schedule (grouped) =====
      // Classification:
      //   corrected       — has at least one POSTED adjusting entry (booked)
      //   clearly_trivial — close_category = unadjusted_immaterial (ISA 450.5)
      //   uncorrected     — everything else: identified, not booked, not trivial
      const misstatementFindings = filtFindings.filter(f => f.finding_type === 'misstatement');
      if (misstatementFindings.length > 0) {
        const classified = misstatementFindings.map(f => {
          const ajes = adjustingEntries.filter(a => a.finding_id === f.id);
          const hasPosted = ajes.some(a => a.is_posted);
          const isTrivial = f.close_category === 'unadjusted_immaterial';
          let cls;
          if (hasPosted) cls = 'corrected';
          else if (isTrivial) cls = 'clearly_trivial';
          else cls = 'uncorrected';
          return { f, ajes, cls };
        });
        const groups = {
          corrected:       classified.filter(r => r.cls === 'corrected'),
          uncorrected:     classified.filter(r => r.cls === 'uncorrected'),
          clearly_trivial: classified.filter(r => r.cls === 'clearly_trivial'),
        };
        const groupMeta = {
          corrected:       { label: 'Corrected misstatements',       hint: 'Management posted adjusting entries — already reflected in the financial statements.' },
          uncorrected:     { label: 'Uncorrected misstatements',     hint: 'Identified misstatements not posted by management — accumulate against materiality per ISA 450.11.' },
          clearly_trivial: { label: 'Clearly trivial misstatements', hint: 'Below the clearly-trivial threshold — not accumulated per ISA 450.5.' },
        };
        const sums = { corrected: 0, uncorrected: 0, clearly_trivial: 0 };

        html += '<h3>Misstatement Schedule (ISA 450)</h3>';
        html += '<p style="font-size:11px; color:#6E6E73; margin-bottom:12px;">Line-by-line view of every misstatement identified during the audit, grouped per ISA 450.5 (clearly trivial) and ISA 450.11 (corrected vs uncorrected).</p>';

        ['corrected', 'uncorrected', 'clearly_trivial'].forEach(key => {
          const rows = groups[key];
          if (rows.length === 0) return;
          const m = groupMeta[key];
          html += `<h4 style="margin-top:14px;">${m.label} (${rows.length})</h4>`;
          html += `<p style="font-size:10px; color:#6E6E73; margin-bottom:6px;">${m.hint}</p>`;
          html += '<table><thead><tr><th>Finding</th><th>Section</th><th>Impact</th><th>Adjusting Entry</th><th>Posted?</th></tr></thead><tbody>';
          rows.forEach(r => {
            const secName = sections.find(s => s.id === r.f.section_id)?.name || '—';
            // Impact: prefer explicit finding.monetary_impact, else fall
            // back to sum of |AJE amounts| (same logic as completion-memo
            // rollup) so the schedule doesn't report 0 when only the AJE
            // amount was entered.
            const findingAmt = Number(r.f.monetary_impact) || 0;
            const ajeAmt = r.ajes.reduce((s, a) => s + Math.abs(Number(a.amount) || 0), 0);
            const amt = findingAmt || ajeAmt;
            sums[key] += Math.abs(amt);
            let aeCell;
            if (r.ajes.length === 0) {
              aeCell = '—';
            } else {
              aeCell = r.ajes.map(a =>
                `Dr ${esc(a.debit_account)} / Cr ${esc(a.credit_account)} — ${Number(a.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}`
              ).join('<br>');
            }
            let postedCell;
            if (r.ajes.length === 0)                       postedCell = '—';
            else if (r.ajes.every(a => a.is_posted))       postedCell = '<span style="color:#065F46; font-weight:600;">POSTED</span>';
            else if (r.ajes.some(a => a.is_posted))        postedCell = '<span style="color:#92400E; font-weight:600;">PARTIAL</span>';
            else                                            postedCell = '<span style="color:#92400E; font-weight:600;">NOT POSTED</span>';
            html += `<tr>
              <td>${esc(r.f.title)}</td>
              <td>${esc(secName)}</td>
              <td style="text-align:right;">${amt.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
              <td>${aeCell}</td>
              <td>${postedCell}</td>
            </tr>`;
          });
          html += `<tr style="font-weight:700; border-top:2px solid #d1d5db;">
            <td colspan="2">${m.label} (Σ)</td>
            <td style="text-align:right;">${sums[key].toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
            <td></td><td></td>
          </tr>`;
          html += '</tbody></table>';
        });

        // Summary vs materiality
        const matOverall = Number(eng.materiality_overall) || 0;
        const matPerf    = Number(eng.materiality_performance) || 0;
        if (matOverall || matPerf) {
          html += '<h4 style="margin-top:14px;">Aggregate evaluation vs materiality (ISA 450.11)</h4>';
          html += '<table><tbody>';
          if (matOverall) html += `<tr><th>Overall materiality</th><td style="text-align:right;">${matOverall.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`;
          if (matPerf)    html += `<tr><th>Performance materiality</th><td style="text-align:right;">${matPerf.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`;
          html += `<tr><th>Uncorrected misstatements (Σ)</th><td style="text-align:right; font-weight:700;">${sums.uncorrected.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`;
          if (matOverall && sums.uncorrected > 0) {
            const pct = (sums.uncorrected / matOverall) * 100;
            html += `<tr><th>Uncorrected as % of overall materiality</th><td style="text-align:right;">${pct.toFixed(1)}%</td></tr>`;
          }
          html += '</tbody></table>';
        }
      }

      } // end of FINDINGS & MISSTATEMENTS SUMMARY (completion-only wrapper)

      // ===== ISA 540 — ACCOUNTING ESTIMATES (completion report only) =====
      if (reportType === 'completion' && estimates.length > 0) {
        const RISK_LABELS = {
          low: 'Low', medium: 'Medium', high: 'High', significant: 'Significant (ISA 540.18)'
        };
        const RISK_CLASS = {
          low: 'chip-green', medium: 'chip-amber', high: 'chip-red', significant: 'chip-red'
        };
        html += '<h2>Significant Accounting Estimates (ISA 540)</h2>';
        html += `<p style="font-size:11px; color:#6E6E73; margin-bottom:12px;">Management's significant accounting estimates and auditor's evaluation under ISA 540. Includes method, key assumptions, data sources, sensitivity, risk assessment, and conclusion for each estimate.</p>`;
        estimates.forEach(e => {
          const secName = (sections.find(s => s.id === e.section_id) || {}).name;
          const riskBadge = e.misstatement_risk
            ? `<span class="chip ${RISK_CLASS[e.misstatement_risk] || ''}">${esc(RISK_LABELS[e.misstatement_risk] || e.misstatement_risk)}</span>`
            : '<span style="color:#6E6E73;">Not assessed</span>';
          html += `<h4 style="margin-top:14px;">${esc(e.estimate_name)}</h4>`;
          html += '<table><tbody>';
          html += `<tr><th style="width:32%;">Risk of material misstatement</th><td>${riskBadge}</td></tr>`;
          if (secName)                html += `<tr><th>Linked section</th><td>${esc(secName)}</td></tr>`;
          if (e.method_used)          html += `<tr><th>Method used (540.13(a))</th><td style="white-space:pre-wrap;">${esc(e.method_used)}</td></tr>`;
          if (e.key_assumptions)      html += `<tr><th>Key assumptions (540.13(c))</th><td style="white-space:pre-wrap;">${esc(e.key_assumptions)}</td></tr>`;
          if (e.data_sources)         html += `<tr><th>Data sources (540.13(b))</th><td style="white-space:pre-wrap;">${esc(e.data_sources)}</td></tr>`;
          if (e.sensitivity_analysis) html += `<tr><th>Sensitivity analysis (540.15)</th><td style="white-space:pre-wrap;">${esc(e.sensitivity_analysis)}</td></tr>`;
          if (e.conclusion)           html += `<tr><th>Auditor's conclusion</th><td style="white-space:pre-wrap;">${esc(e.conclusion)}</td></tr>`;
          html += '</tbody></table>';
        });
      }

      // ===== ISA 505 — EXTERNAL CONFIRMATIONS (completion report only) =====
      if (reportType === 'completion' && confirmations.length > 0) {
        const TYPE_LABELS = {
          bank: 'Bank', ar: 'AR', ap: 'AP', legal: 'Legal',
          related_party: 'Related party', other: 'Other'
        };
        const RESULT_LABELS = {
          clean: { label: 'Clean', chip: 'chip-green' },
          exception: { label: 'Exception', chip: 'chip-red' },
          partial: { label: 'Partial', chip: 'chip-amber' },
          no_reply: { label: 'No reply', chip: 'chip-amber' },
        };
        html += '<h2>External Confirmations (ISA 505)</h2>';
        // Summary row
        const counts = { clean: 0, exception: 0, partial: 0, no_reply: 0, pending: 0 };
        confirmations.forEach(c => {
          if (!c.result) counts.pending++; else counts[c.result] = (counts[c.result] || 0) + 1;
        });
        html += `<p style="font-size:11px; color:#6E6E73; margin-bottom:12px;">Summary: ${counts.clean} clean &middot; ${counts.exception} exception &middot; ${counts.partial} partial &middot; ${counts.no_reply} no reply &middot; ${counts.pending} pending. Per ISA 505.12, alternative procedures performed for unreturned / exception confirmations are documented in the rightmost column.</p>`;
        html += '<table><thead><tr><th>Counterparty</th><th>Type</th><th>Sent</th><th>Returned</th><th>Result</th><th>Section</th><th>Alternative procedures (505.12)</th></tr></thead><tbody>';
        confirmations.forEach(c => {
          const r = c.result ? RESULT_LABELS[c.result] : null;
          const resultCell = r
            ? `<span class="chip ${r.chip}">${r.label}</span>`
            : '<span style="color:#6E6E73;">Pending</span>';
          const secName = (sections.find(s => s.id === c.section_id) || {}).name;
          html += `<tr>
            <td>${esc(c.counterparty)}</td>
            <td>${esc(TYPE_LABELS[c.confirmation_type] || c.confirmation_type)}</td>
            <td>${c.sent_date || '—'}</td>
            <td>${c.returned_date || '—'}</td>
            <td>${resultCell}</td>
            <td>${secName ? esc(secName) : '—'}</td>
            <td style="white-space:pre-wrap; font-size:10px;">${c.alternative_procedures ? esc(c.alternative_procedures) : '<span style="color:#6E6E73;">—</span>'}</td>
          </tr>`;
        });
        html += '</tbody></table>';
      }

      // ===== ISA 530 — AUDIT SAMPLING (completion report only) =====
      if (reportType === 'completion') {
        const procById   = Object.fromEntries(procedures.map(p => [p.id, p]));
        const samplings  = samplingsAll.filter(s => procById[s.procedure_id]);
        if (samplings.length > 0) {
          const METHOD_LABELS = {
            random: 'Random', systematic: 'Systematic', haphazard: 'Haphazard',
            monetary_unit: 'Monetary unit', judgmental: 'Judgmental', other: 'Other',
          };
          html += '<h2>Audit Sampling Documentation (ISA 530)</h2>';
          html += '<p style="font-size:11px; color:#6E6E73; margin-bottom:12px;">Per-procedure sampling judgments: population, method, sample size, selection basis, results, and projection per ISA 530.7-15.</p>';
          samplings.forEach(s => {
            const proc = procById[s.procedure_id];
            const sec  = sections.find(x => x.id === proc.section_id);
            const ratio = (s.population_size != null && s.sample_size != null)
              ? `${s.sample_size} of ${s.population_size}` : '—';
            html += `<h4 style="margin-top:14px;">${esc((sec && sec.name) || 'Section')} &mdash; ${esc(proc.description.length > 90 ? proc.description.slice(0,90) + '…' : proc.description)}</h4>`;
            html += '<table><tbody>';
            html += `<tr><th style="width:32%;">Sample / Population</th><td>${esc(ratio)}</td></tr>`;
            html += `<tr><th>Method</th><td>${esc(METHOD_LABELS[s.sampling_method] || s.sampling_method || '—')}</td></tr>`;
            if (s.population_description) html += `<tr><th>Population</th><td style="white-space:pre-wrap;">${esc(s.population_description)}</td></tr>`;
            if (s.selection_basis)        html += `<tr><th>Selection basis</th><td style="white-space:pre-wrap;">${esc(s.selection_basis)}</td></tr>`;
            if (s.results_summary)        html += `<tr><th>Results</th><td style="white-space:pre-wrap;">${esc(s.results_summary)}</td></tr>`;
            if (s.projection_amount != null) html += `<tr><th>Projected misstatement</th><td>${Number(s.projection_amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`;
            if (s.conclusion)             html += `<tr><th>Conclusion</th><td style="white-space:pre-wrap;">${esc(s.conclusion)}</td></tr>`;
            html += '</tbody></table>';
          });
        }
      }

      // ===== SECTION-BY-SECTION WORKPAPERS — DELIBERATELY OMITTED FROM PARTNER REPORTS =====
      // Per audit methodology (ISA 220, KPMG Clara, EY Canvas, BDO etc.) the
      // partner-facing reports contain PLANNING and COMPLETION only. Detailed
      // section workpapers are the team's execution evidence file and live
      // inside Audexon — they are not exported to the partner PDF. The
      // Completion Memorandum's "Work-done summary" block (below) gives the
      // partner a high-level conclusion per section without execution noise.

      // ===== 3B. WORK-DONE SUMMARY (completion report only) =====
      // High-level per-section synthesis: status + procedure counts + findings.
      // Replaces the previous Section Workpapers detail dump.
      if (reportType === 'completion') {
        html += '<h2>Work-done summary</h2>';
        html += '<p style="font-size:11px; color:#6E6E73; margin-bottom:12px;">Per-section conclusion of work performed. Detailed procedures and evidence remain in the audit file inside Audexon.</p>';
        const interimSections = filtSections.filter(s => s.phase === 'interim');
        const finalSections = filtSections.filter(s => s.phase !== 'interim');
        const orderedSections = [...interimSections, ...finalSections];
        if (orderedSections.length === 0) {
          html += '<p class="no-data">No sections.</p>';
        } else {
          html += '<table><thead><tr><th>Section</th><th style="width:12%;">Phase</th><th style="width:14%;">Procedures done</th><th style="width:12%;">Findings</th><th style="width:14%;">Status</th></tr></thead><tbody>';
          for (const s of orderedSections) {
            const secProcs    = procedures.filter(p => p.section_id === s.id);
            const secProcIds  = new Set(secProcs.map(p => p.id));
            const doneCt      = responses.filter(r => secProcIds.has(r.procedure_id) && r.status === 'done').length;
            const secFindings = findings.filter(f => f.section_id === s.id);
            const openFnd     = secFindings.filter(f => f.status === 'open').length;
            const totalFnd    = secFindings.length;
            const findCell    = totalFnd === 0
              ? '<span style="color:#6E6E73;">None</span>'
              : (openFnd > 0
                  ? '<span style="color:#991B1B; font-weight:600;">' + openFnd + ' open</span> / ' + totalFnd
                  : '<span style="color:#15803D; font-weight:600;">' + totalFnd + ' resolved</span>');
            const phaseBadge  = s.phase === 'interim' ? '<span class="chip chip-blue">Interim</span>' : '<span class="chip chip-grey">Final</span>';
            html += `<tr>
              <td><strong>${esc(s.name)}</strong></td>
              <td>${phaseBadge}</td>
              <td>${doneCt} / ${secProcs.length}</td>
              <td>${findCell}</td>
              <td>${statusChip(s.status)}</td>
            </tr>`;
            if (s.engagement_specific_risks) {
              html += `<tr><td colspan="5" style="background:#FFFBEB; padding:8px 12px; font-size:11px; color:#374151;"><strong style="color:#92400E; font-size:10px; text-transform:uppercase; letter-spacing:0.5px;">Engagement-specific risks (ISA 330):</strong> ${esc(s.engagement_specific_risks)}</td></tr>`;
            }
            if (s.conclusion) {
              html += `<tr><td colspan="5" style="background:#FAFAFA; padding:8px 12px; font-size:11px; color:#374151; border-bottom:2px solid #E5E5EA;"><strong style="color:#6E6E73; font-size:10px; text-transform:uppercase; letter-spacing:0.5px;">Section conclusion:</strong> ${esc(s.conclusion)}</td></tr>`;
            }
          }
          html += '</tbody></table>';
        }
      }

      // ===== SECTION WORKPAPERS — full detail (Audit File / execution report only) =====
      // The partner-facing Completion memo shows only the high-level "Work-done
      // summary" above. The Audit File (execution) report is the team's full
      // execution evidence: per-section sign-offs, conclusion, procedures & work
      // performed, documents, finding details, and review notes.
      if (isExec) {
        html += '<h2>Section Workpapers</h2>';
        html += '<p style="font-size:11px; color:#6E6E73; margin-bottom:12px;">Full execution evidence per section: sign-offs, conclusion, procedures &amp; work performed, documents referenced, findings, and review notes.</p>';
        const interimSections = filtSections.filter(s => s.phase === 'interim');
        const finalSections   = filtSections.filter(s => s.phase !== 'interim');
        const orderedSections = [...interimSections, ...finalSections];
        let currentPhase = '';
        for (const s of orderedSections) {
        const phase = s.phase || 'final';
        if (phase !== currentPhase) {
          currentPhase = phase;
          html += `<div class="phase-divider">${phase} Phase</div>`;
        }

        const assignee = s.assigned_to ? (profiles[s.assigned_to] || '—') : 'Unassigned';
        const secProcs = procedures.filter(p => p.section_id === s.id);
        const secFindings = findings.filter(f => f.section_id === s.id);
        const secDocs = documents.filter(d => d.section_id === s.id);
        const secNotes = reviewNotes.filter(n => n.section_id === s.id);

        // Sign-off info
        const supApproved = formatDateLong(s.supervisor_approved_at) || '—';
        const supName = s.supervisor_approved_by ? (profiles[s.supervisor_approved_by] || '—') : '—';
        const partApproved = formatDateLong(s.partner_approved_at) || '—';
        const partName2 = s.partner_approved_by ? (profiles[s.partner_approved_by] || '—') : '—';

        html += `<div class="wp-section">`;
        html += `<div class="wp-header">
          <div class="wp-title">${esc(s.name)} ${phase === 'interim' ? '<span class="badge b-interim">Interim</span>' : ''} <span class="badge b-${s.status === 'approved' ? 'approved' : 'pending'}">${(s.status || 'not started').replace(/_/g, ' ')}</span></div>
          <div class="wp-meta">Assigned: ${esc(assignee)} | Supervisor: ${esc(supName)} (${supApproved}) | Partner: ${esc(partName2)} (${partApproved})</div>
        </div>`;

        // Conclusion
        if (s.conclusion) {
          html += `<div class="wp-conclusion"><div class="wp-conclusion-label">Section Conclusion</div>${esc(s.conclusion)}</div>`;
        }

        // Procedures table
        html += '<h4>Procedures & Work Performed</h4>';
        if (secProcs.length === 0) {
          html += '<p class="no-data">No procedures.</p>';
        } else {
          html += '<table><thead><tr><th>Procedure</th><th>Type</th><th>Work Performed</th><th>Status</th></tr></thead><tbody>';
          for (const p of secProcs) {
            const resp = responses.find(r => r.procedure_id === p.id);
            const status = resp?.status || 'pending';
            const asserts = (p.assertions || []).map(a => ASSERTION_LABEL[a] || a).join(', ');
            html += `<tr>
              <td>${esc(p.description)}${asserts ? '<div style="font-size:9px;color:#6b7280;margin-top:3px;">Assertions: ' + esc(asserts) + '</div>' : ''}</td>
              <td>${esc(PROC_TYPE_LABEL[p.procedure_type] || (p.procedure_type || 'other').replace(/_/g, ' '))}</td>
              <td>${resp?.response ? esc(resp.response) : '<span style="color:#dc2626;font-style:italic;">Not recorded</span>'}</td>
              <td><span class="badge b-${status}">${status}</span></td>
            </tr>`;
          }
          html += '</tbody></table>';
        }

        // Documents table
        const allSecDocs = [...documents.filter(d => {
          const procIds = secProcs.map(p => p.id);
          const respIds = responses.filter(r => procIds.includes(r.procedure_id)).map(r => r.id);
          return respIds.includes(d.procedure_response_id) || d.section_id === s.id;
        })];
        if (allSecDocs.length > 0) {
          html += '<h4>Documents Referenced</h4>';
          html += '<table><thead><tr><th>File Name</th><th>Category</th><th>Description</th></tr></thead><tbody>';
          allSecDocs.forEach(d => {
            html += `<tr><td>${esc(d.file_name)}</td><td><span class="doc-cat">${d.doc_category === 'working_paper' ? 'Work File' : 'Client File'}</span></td><td>${esc(d.description || '—')}</td></tr>`;
          });
          html += '</tbody></table>';
        }

        // Section findings
        if (secFindings.length > 0) {
          html += '<h4>Finding Details</h4>';
          for (const f of secFindings) {
            const adjEntries = adjustingEntries.filter(a => a.finding_id === f.id);
            const sevColor = f.severity === 'high' ? '#991B1B' : f.severity === 'medium' ? '#92400E' : '#4B5563';
            const statusColor = f.status === 'open' ? '#92400E' : f.status === 'resolved' ? '#065F46' : '#1E40AF';

            html += `<div style="border:1px solid #D9D9D9; border-radius:4px; padding:14px 16px; margin-bottom:12px;">
              <div style="font-weight:700; font-size:13px; margin-bottom:6px;">${esc(f.title)}
                <span style="color:${sevColor}; font-size:11px; margin-left:8px;">${f.severity.toUpperCase()}</span>
                <span style="color:${statusColor}; font-size:11px; margin-left:8px;">${f.status.toUpperCase()}</span>
              </div>`;

            if (f.condition) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Description</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.condition)}</div></div>`;
            if (f.effect) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Impact</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.effect)}</div></div>`;
            if (f.recommendation) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Recommendation</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.recommendation)}</div></div>`;
            if (f.management_response) html += `<div style="margin-top:6px;"><span style="font-size:9px;font-weight:700;color:#1A3A5F;text-transform:uppercase;">Management Response</span><div style="font-size:11px;color:#374151;margin-top:2px;">${esc(f.management_response)}</div></div>`;

            // ML flag + Adjusting entry status inline
            let footerParts = [];
            if (f.is_management_letter_point) footerParts.push('<span style="color:#3730A3;font-weight:600;">ML</span> Management Letter Point');
            else footerParts.push('No Management Letter point for this finding.');

            if (adjEntries.length > 0) {
              for (const a of adjEntries) {
                html += `<div style="border:1px solid #FDE68A; background:#FFFBEB; border-radius:4px; padding:8px 12px; margin-top:8px; font-size:11px;">
                  <strong>Adjusting Entry:</strong> Dr ${esc(a.debit_account)} / Cr ${esc(a.credit_account)} — ${Number(a.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}
                  ${a.narration ? ' (' + esc(a.narration) + ')' : ''}
                  <span style="color:${a.is_posted ? '#065F46' : '#92400E'}; font-weight:600; margin-left:8px;">${a.is_posted ? 'POSTED' : 'NOT POSTED'}</span>
                </div>`;
              }
            } else {
              footerParts.push('No adjusting entry.');
            }

            html += `<div style="font-size:10px; color:#6b7280; margin-top:10px; padding-top:8px; border-top:1px solid #EBEBEB;">${footerParts.join(' &nbsp;&nbsp;&nbsp; ')}</div>`;
            html += '</div>';
          }
        }

        // Review notes table
        const significantNotes = secNotes.filter(n => n.note_type === 'review_comment' || n.note_type === 'return_reason');
        if (significantNotes.length > 0) {
          html += '<h4>Review Notes</h4>';
          html += '<table><thead><tr><th>Reviewer</th><th>Date</th><th>Note</th><th>Type</th></tr></thead><tbody>';
          significantNotes.forEach(n => {
            const who = n.profiles?.full_name || n.profiles?.email || 'User';
            const date = formatDateLong(n.created_at) || '—';
            const typeLabel = n.note_type === 'return_reason' ? 'Return' : 'Review';
            html += `<tr><td>${esc(who)}</td><td>${date}</td><td>${esc(n.note)}</td><td>${typeLabel}</td></tr>`;
          });
          html += '</tbody></table>';
        }

        html += '</div>'; // wp-section
        }
      } // end if (isExec) — Section Workpapers full detail

      // ===== 4. MANAGEMENT LETTER POINTS + (completion memo) + TRIAL BALANCE =====
      // ML points and TB summary are shared by completion + audit file; the
      // completion memorandum body itself stays completion-only (see `isCompletion` below).
      if (showFindingsTbMl) {
      const mlFindings = filtFindings.filter(f => f.is_management_letter_point);
      html += '<h2>Management Letter Points</h2>';
      if (mlFindings.length === 0) {
        html += '<p class="no-data">No management letter points.</p>';
      } else {
        html += '<table><thead><tr><th>#</th><th>Finding</th><th>Section</th><th>Severity</th><th>Recommendation</th></tr></thead><tbody>';
        mlFindings.forEach((f, i) => {
          const secName = sections.find(s => s.id === f.section_id)?.name || '—';
          html += `<tr><td>${i + 1}</td><td>${esc(f.title)}</td><td>${esc(secName)}</td><td><span class="badge b-${f.severity}">${f.severity}</span></td><td>${esc(f.recommendation || '—')}</td></tr>`;
        });
        html += '</tbody></table>';
      }

      // ===== 4B. COMPLETION MEMO (ISA 220 / ISA 700) — completion report only =====
      if (cm && isCompletion) {
        html += '<h2>Engagement Completion Memorandum</h2>';
        const cmStatus = cm.status === 'locked' ? 'b-approved' : (cm.status === 'complete' ? 'b-reported' : 'b-pending');
        const cmStatusLabel = cm.status === 'locked' ? 'LOCKED &amp; SIGNED' : cm.status.toUpperCase();
        const fmt = (n) => n != null ? Number(n).toLocaleString(undefined, { minimumFractionDigits: 0 }) : '—';
        // Memo signer: cm.signed_by → profiles cache (never empty after
        // the cache hardening above) → fall back to the resolved
        // partnerName from findEngagementPartner if signer isn't in the
        // org's profile list for some reason (rare — external EQR, etc.).
        const partnerSignedBy = cm.signed_by
          ? (profiles[cm.signed_by] || partnerName || '—')
          : '—';

        html += `<table><tbody>
          <tr><th style="width:32%;">Status</th><td><span class="badge ${cmStatus}">${cmStatusLabel}</span> ${cm.signed_at ? '&middot; signed ' + formatDateLong(cm.signed_at) + ' by ' + esc(partnerSignedBy) : ''}</td></tr>
          <tr><th>Opinion type</th><td>${esc((cm.opinion_type || '—').toUpperCase())}</td></tr>
          ${cm.opinion_basis_notes ? `<tr><th>Opinion basis</th><td>${esc(cm.opinion_basis_notes)}</td></tr>` : ''}
          <tr><th>Sections approved</th><td>${cm.sections_approved} / ${cm.total_sections}</td></tr>
          <tr><th>Findings (open / resolved / reported)</th><td>${cm.findings_open} / ${cm.findings_resolved} / ${cm.findings_reported}</td></tr>
          <tr><th>Adjusting entries (posted / unposted)</th><td>${cm.posted_adjustments} / ${cm.unposted_adjustments}</td></tr>
          ${cm.overall_materiality_snapshot ? `<tr><th>Materiality (overall / performance)</th><td>${fmt(cm.overall_materiality_snapshot)} / ${fmt(cm.performance_materiality_snapshot)}</td></tr>` : ''}
          ${cm.uncorrected_vs_materiality ? `<tr><th>Uncorrected vs materiality</th><td>${esc(cm.uncorrected_vs_materiality.replace(/_/g, ' '))}</td></tr>` : ''}
          <tr><th>EQR required</th><td>${cm.eqr_required ? '&#10003; Yes' : '&minus; No'}${cm.eqr_completed_at ? ' &middot; completed ' + formatDateLong(cm.eqr_completed_at) : ''}</td></tr>
          ${eng.is_archived ? `<tr><th>File assembly (ISA 230)</th><td><span class="badge b-approved">ARCHIVED</span> ${eng.archived_at ? '&middot; assembled ' + formatDateLong(eng.archived_at) : ''}${eng.archived_by && profiles[eng.archived_by] ? ' by ' + esc(profiles[eng.archived_by]) : ''}</td></tr>` : ''}
        </tbody></table>`;

        // ----- ISA 570 — Going Concern (structured assessment + rationale) -----
        if (cm.going_concern_assessment || cm.going_concern_conclusion) {
          const GC_LABELS = {
            no_uncertainty:                  'No material uncertainty identified',
            identified_disclosed:            'Material uncertainty identified — adequately disclosed',
            identified_adverse_implications: 'Material uncertainty identified — adverse / disclaimer implications'
          };
          const gcLabel = GC_LABELS[cm.going_concern_assessment] || cm.going_concern_assessment || '—';
          html += `<h4>Going concern (ISA 570)</h4>`;
          html += `<table><tbody>
            <tr><th style="width:32%;">Assessment</th><td>${esc(gcLabel)}</td></tr>
            ${cm.going_concern_conclusion ? `<tr><th>Rationale</th><td style="white-space:pre-wrap;">${esc(cm.going_concern_conclusion)}</td></tr>` : ''}
          </tbody></table>`;
        }

        // ----- ISA 560 — Subsequent Events (structured: procedures + review-through + identified + conclusion) -----
        if (cm.subseq_events_procedures || cm.subseq_events_review_through || cm.subsequent_events_conclusion) {
          html += `<h4>Subsequent events (ISA 560)</h4>`;
          html += `<table><tbody>
            ${cm.subseq_events_procedures ? `<tr><th style="width:32%;">Procedures performed</th><td style="white-space:pre-wrap;">${esc(cm.subseq_events_procedures)}</td></tr>` : ''}
            ${cm.subseq_events_review_through ? `<tr><th>Reviewed through date</th><td>${formatDateLong(cm.subseq_events_review_through) || '—'}</td></tr>` : ''}
            <tr><th>Events identified</th><td>${cm.subseq_events_identified ? '&#10003; Yes' : '&minus; No'}</td></tr>
            ${cm.subsequent_events_conclusion ? `<tr><th>Conclusion</th><td style="white-space:pre-wrap;">${esc(cm.subsequent_events_conclusion)}</td></tr>` : ''}
          </tbody></table>`;
        }

        // ----- ISA 520 — Final Analytical Review -----
        if (cm.final_analytical_review_conclusion) {
          html += `<h4>Final analytical review (ISA 520)</h4>`;
          html += `<div style="font-size:11px; color:#374151; white-space:pre-wrap; line-height:1.6; margin-bottom:12px;">${esc(cm.final_analytical_review_conclusion)}</div>`;
        }

        // ----- ISA 450 — Uncorrected Misstatements Evaluation -----
        if (cm.uncorrected_misstatements_evaluation || cm.uncorrected_misstatements_mgmt_rationale) {
          html += `<h4>Uncorrected misstatements evaluation (ISA 450)</h4>`;
          html += `<table><tbody>
            ${cm.uncorrected_misstatements_evaluation ? `<tr><th style="width:32%;">Auditor's evaluation</th><td style="white-space:pre-wrap;">${esc(cm.uncorrected_misstatements_evaluation)}</td></tr>` : ''}
            ${cm.uncorrected_misstatements_mgmt_rationale ? `<tr><th>Management's rationale for not correcting</th><td style="white-space:pre-wrap;">${esc(cm.uncorrected_misstatements_mgmt_rationale)}</td></tr>` : ''}
          </tbody></table>`;
        }

        // ----- ISA 220 / IESBA — Final Independence Conclusion -----
        if (cm.final_independence_conclusion) {
          html += `<h4>Final independence conclusion (ISA 220 / IESBA Code)</h4>`;
          html += `<div style="font-size:11px; color:#374151; white-space:pre-wrap; line-height:1.6; margin-bottom:12px;">${esc(cm.final_independence_conclusion)}</div>`;
        }

        // ----- ISA 580 — Management Representation Letter -----
        if (cm.mgmt_rep_letter_obtained || cm.mgmt_rep_letter_date) {
          html += `<h4>Management representation letter (ISA 580)</h4>`;
          html += `<table><tbody>
            <tr><th style="width:32%;">Obtained</th><td>${cm.mgmt_rep_letter_obtained ? '<span class="chip chip-green">Yes</span>' : '<span class="chip chip-red">No — required before sign-off</span>'}</td></tr>
            ${cm.mgmt_rep_letter_date ? `<tr><th>Letter date</th><td>${formatDateLong(cm.mgmt_rep_letter_date) || '—'}</td></tr>` : ''}
            ${cm.mgmt_rep_letter_reference ? `<tr><th>File reference</th><td>${esc(cm.mgmt_rep_letter_reference)}</td></tr>` : ''}
          </tbody></table>`;
        }

        // ----- ISA 260 — Communication with TCWG -----
        if (cm.tcwg_communicated || cm.tcwg_communication_date) {
          html += `<h4>Communication with TCWG (ISA 260)</h4>`;
          html += `<table><tbody>
            <tr><th style="width:32%;">Communicated</th><td>${cm.tcwg_communicated ? '<span class="chip chip-green">Yes</span>' : '<span class="chip chip-grey">Not yet</span>'}</td></tr>
            ${cm.tcwg_communication_date ? `<tr><th>Communication date</th><td>${formatDateLong(cm.tcwg_communication_date) || '—'}</td></tr>` : ''}
            ${cm.tcwg_matters_communicated ? `<tr><th>Matters communicated</th><td style="white-space:pre-wrap;">${esc(cm.tcwg_matters_communicated)}</td></tr>` : ''}
            ${cm.tcwg_response ? `<tr><th>TCWG response</th><td style="white-space:pre-wrap;">${esc(cm.tcwg_response)}</td></tr>` : ''}
          </tbody></table>`;
        }

        if (cm.other_matters) {
          html += `<h4>Other matters</h4>`;
          html += `<div style="font-size:11px; color:#374151; white-space:pre-wrap; line-height:1.6; margin-bottom:12px;">${esc(cm.other_matters)}</div>`;
        }

        if (cmAttests.length > 0) {
          html += '<h4>Partner attestations</h4>';
          html += '<table><thead><tr><th>Attestation</th><th style="text-align:center; width:50px;">Ack</th><th>By</th><th>At</th></tr></thead><tbody>';
          cmAttests.forEach(a => {
            const who = a.acknowledged_by ? (profiles[a.acknowledged_by] || '—') : '—';
            const when = formatDateLong(a.acknowledged_at) || '—';
            html += `<tr><td>${esc(a.attestation_text || '—')}</td><td style="text-align:center;">${a.is_acknowledged ? '&#10003;' : '&minus;'}</td><td>${esc(who)}</td><td>${when}</td></tr>`;
          });
          html += '</tbody></table>';
        }
      }

      // ===== 5. TRIAL BALANCE SUMMARY =====
      html += '<h2>Trial Balance Summary</h2>';
      if (tbLines.length === 0) {
        html += '<p class="no-data">No trial balance imported.</p>';
      } else {
        const groups = {};
        let grandTotal = 0;
        let totalDebits = 0;
        let totalCredits = 0;
        tbLines.forEach(line => {
          const cls = line.classification || 'Unclassified';
          if (!groups[cls]) groups[cls] = { count: 0, total: 0 };
          const bal = parseFloat(line.balance) || 0;
          groups[cls].count++;
          groups[cls].total += bal;
          grandTotal += bal;
          // Debits = positive balances on asset/expense; credits = negative.
          // For TBs imported with explicit debit/credit columns, prefer those.
          if (line.debit_amount != null || line.credit_amount != null) {
            totalDebits  += parseFloat(line.debit_amount)  || 0;
            totalCredits += parseFloat(line.credit_amount) || 0;
          } else {
            // Sign-based fallback when only `balance` is populated
            if (bal >= 0) totalDebits  += bal;
            else          totalCredits += Math.abs(bal);
          }
        });
        // Balance check — tolerate 0.01 rounding for currency
        const isBalanced = Math.abs(totalDebits - totalCredits) < 0.01;
        const totalLines = tbLines.length;

        html += '<table><thead><tr><th>Classification</th><th>Lines</th><th>Total Balance</th></tr></thead><tbody>';
        html += Object.entries(groups).map(([cls, g]) =>
          `<tr><td>${esc(cls)}</td><td>${g.count}</td><td style="text-align:right;">${g.total.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`
        ).join('');
        // Totals row + balance check
        html += `<tr style="background:#F5F7FA; font-weight:700; border-top:2px solid #CBD2DF;">
          <td>TOTAL</td>
          <td>${totalLines}</td>
          <td style="text-align:right;">${grandTotal.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
        </tr>`;
        html += '</tbody></table>';
        // Balance check indicator
        html += `<div style="margin-top:10px; padding:10px 14px; border-radius:6px; font-size:12px; ${
          isBalanced
            ? 'background:#EDFAF3; color:#065F46; border-left:3px solid #065F46;'
            : 'background:#FEF0F0; color:#991B1B; border-left:3px solid #991B1B;'
        }">
          ${isBalanced
            ? `&#10003; <strong>Trial balance is in balance.</strong> Debits ${totalDebits.toLocaleString(undefined, { minimumFractionDigits: 2 })} = Credits ${totalCredits.toLocaleString(undefined, { minimumFractionDigits: 2 })}`
            : `&#10007; <strong>Trial balance is OUT OF BALANCE.</strong> Debits ${totalDebits.toLocaleString(undefined, { minimumFractionDigits: 2 })} &ne; Credits ${totalCredits.toLocaleString(undefined, { minimumFractionDigits: 2 })} (diff ${Math.abs(totalDebits - totalCredits).toLocaleString(undefined, { minimumFractionDigits: 2 })})`
          }
        </div>`;
      }

      // ===== 5b. ADJUSTED TB + UNCORRECTED MISSTATEMENTS (ISA 450) =====
      {
        const f = (n) => (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2 });
        const postedIds = new Set(journalEntries.filter(e => e.isa450_status === 'corrected' && e.is_posted_to_adjusted_tb).map(e => e.id));
        const adjByLine = {};
        journalLines.forEach(l => {
          if (!postedIds.has(l.journal_entry_id) || !l.trial_balance_line_id) return;
          adjByLine[l.trial_balance_line_id] = (adjByLine[l.trial_balance_line_id] || 0) + (parseFloat(l.debit) || 0) - (parseFloat(l.credit) || 0);
        });
        const adjustedLines = tbLines.filter(l => adjByLine[l.id]);
        if (adjustedLines.length) {
          html += '<h2>Adjusted Trial Balance (ISA 450)</h2>';
          html += '<p style="font-size:12px; color:#5b7186;">Accounts affected by posted (corrected) audit adjustments. Original balances are unchanged; adjustments roll up to the audited figures.</p>';
          html += '<table><thead><tr><th>Code</th><th>Account</th><th style="text-align:right;">Original</th><th style="text-align:right;">Adjustment</th><th style="text-align:right;">Audited</th></tr></thead><tbody>';
          adjustedLines.forEach(l => {
            const orig = parseFloat(l.balance) || 0; const net = adjByLine[l.id] || 0;
            html += `<tr><td>${esc(l.account_code)}</td><td>${esc(l.account_name)}</td><td style="text-align:right;">${f(orig)}</td><td style="text-align:right;">${f(net)}</td><td style="text-align:right; font-weight:600;">${f(orig + net)}</td></tr>`;
          });
          html += '</tbody></table>';
        }

        const uncs = journalEntries.filter(e => e.isa450_status === 'uncorrected');
        html += '<h2>Summary of Uncorrected Misstatements (ISA 450)</h2>';
        const om = matActive ? (parseFloat(matActive.overall_materiality) || 0) : 0;
        if (matActive) {
          const pm = parseFloat(matActive.performance_materiality_amount) || 0;
          const triv = parseFloat(matActive.trivial_amount) || 0;
          html += `<p style="font-size:12px; color:#5b7186;">Overall materiality ${f(om)} &middot; Performance materiality ${f(pm)} &middot; Clearly-trivial ${f(triv)}</p>`;
        }
        if (!uncs.length) {
          html += '<p class="no-data">No uncorrected misstatements — all identified misstatements are corrected or clearly trivial.</p>';
        } else {
          let totAmt = 0, totPl = 0;
          html += '<table><thead><tr><th>#</th><th>Narration</th><th>Type</th><th>Misstatement</th><th style="text-align:right;">Amount</th><th style="text-align:right;">Effect on profit</th></tr></thead><tbody>';
          uncs.forEach((e, i) => {
            const legs = journalLines.filter(l => l.journal_entry_id === e.id);
            const amt = legs.reduce((s, l) => s + (parseFloat(l.debit) || 0), 0);
            let pl = 0, plKnown = false;
            legs.forEach(l => {
              const tbl = tbLines.find(t => t.id === l.trial_balance_line_id);
              const at = tbl ? tbl.account_type : null;
              if (at === 'income' || at === 'expense') { pl += (parseFloat(l.credit) || 0) - (parseFloat(l.debit) || 0); plKnown = true; }
            });
            totAmt += amt; totPl += pl;
            html += `<tr><td>${i + 1}</td><td>${esc(e.description || '—')}</td><td>${e.impact_type === 'reclassification' ? 'Reclass' : 'Adjustment'}</td><td>${e.misstatement_type ? esc(e.misstatement_type) : '—'}</td><td style="text-align:right;">${f(amt)}</td><td style="text-align:right;">${plKnown ? f(pl) : '—'}</td></tr>`;
          });
          html += `<tr style="background:#F5F7FA; font-weight:700; border-top:2px solid #CBD2DF;"><td colspan="4">TOTAL UNCORRECTED</td><td style="text-align:right;">${f(totAmt)}</td><td style="text-align:right;">${f(totPl)}</td></tr>`;
          html += '</tbody></table>';
          if (matActive && om > 0) {
            const below = totAmt < om; const pct = (totAmt / om * 100).toFixed(1);
            html += `<div style="margin-top:10px; padding:10px 14px; border-radius:6px; font-size:12px; ${below ? 'background:#EDFAF3; color:#065F46; border-left:3px solid #065F46;' : 'background:#FEF0F0; color:#991B1B; border-left:3px solid #991B1B;'}">${below ? '&#10003;' : '&#10007;'} Aggregate uncorrected ${f(totAmt)} = ${pct}% of overall materiality${below ? ' (below materiality).' : ' — EXCEEDS overall materiality; evaluate the effect on the opinion (ISA 450.11).'}</div>`;
          }
        }
      }
      } // end if (reportType === 'completion') — wraps ML + CM + TB

      document.getElementById('report-content').innerHTML = html;
      const reportLabel = reportType === 'planning' ? 'Planning Memorandum' : isExec ? 'Audit File' : 'Completion Memorandum';
      document.title = eng.client_name + ' — ' + reportLabel + ' — Audexon';
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
