<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Audexon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; color: #1A1A2E; background: #F5F7FA; line-height: 1.7; }
    .nav { background: #0A1A2F; padding: 0 24px; height: 56px; display: flex; align-items: center; }
    .nav a { color: white; text-decoration: none; font-size: 20px; font-weight: 800; }
    .nav a span { color: #3A7BFF; }
    .content { max-width: 520px; margin: 0 auto; padding: 60px 24px 80px; text-align: center; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    .subtitle { font-size: 15px; color: #6B7280; margin-bottom: 40px; }
    .contact-card { background: white; border-radius: 12px; border: 1px solid #E5E7EB; padding: 32px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .contact-item { padding: 16px 0; border-bottom: 1px solid #F3F4F6; }
    .contact-item:last-child { border-bottom: none; }
    .contact-label { font-size: 12px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .contact-value { font-size: 15px; color: #1A1A2E; font-weight: 500; }
    .contact-value a { color: #3A7BFF; text-decoration: none; }
    .footer { text-align: center; padding: 24px; font-size: 12px; color: #9CA3AF; }
  </style>
</head>
<body>
  <nav class="nav"><a href="/">Audexon<span>.</span></a></nav>
  <div class="content">
    <h1>Contact Us</h1>
    <p class="subtitle">Have questions or need support? We're here to help.</p>
    <div class="contact-card">
      <div class="contact-item">
        <div class="contact-label">Email</div>
        <div class="contact-value"><a href="mailto:support@audexon.com">support@audexon.com</a></div>
      </div>
      <div class="contact-item">
        <div class="contact-label">General Inquiries</div>
        <div class="contact-value"><a href="mailto:hello@audexon.com">hello@audexon.com</a></div>
      </div>
      <div class="contact-item">
        <div class="contact-label">Response Time</div>
        <div class="contact-value">We typically respond within 24 hours</div>
      </div>
    </div>
  </div>
  <div class="footer">Audexon — Built for auditors who move fast.</div>
</body>
</html>
