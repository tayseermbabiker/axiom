<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Audexon</title>
  <script>
    (function () { try { var l=localStorage.getItem('audexon_lang'); if(l!=='ar'&&l!=='en')l='en';
      document.documentElement.setAttribute('lang',l); document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr'); } catch(e){} })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html[dir="rtl"] body { font-family: 'Tajawal', 'Inter', sans-serif; }
    html[dir="rtl"] .content { text-align: right; }

    body { font-family: 'Inter', sans-serif; color: #1A1A2E; background: #F5F7FA; line-height: 1.7; }
    .nav { background: #0A1A2F; padding: 0 24px; height: 56px; display: flex; align-items: center; }
    .nav a { color: white; text-decoration: none; font-size: 20px; font-weight: 800; }
    .nav a span { color: #3A7BFF; }
    .content { max-width: 520px; margin: 0 auto; padding: 60px 24px 80px; text-align: center; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    .subtitle { font-size: 15px; color: #6B7280; margin-bottom: 40px; }
    .contact-card { background: white; border-radius: 12px; border: 1px solid #E5E7EB; padding: 32px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .contact-item { padding: 16px 0; border-bottom: 1px solid #F3F4F6; }
    .contact-item:last-child { border-bottom: none; }
    .contact-label { font-size: 12px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .contact-value { font-size: 15px; color: #1A1A2E; font-weight: 500; }
    .contact-value a { color: #3A7BFF; text-decoration: none; }
    .footer { text-align: center; padding: 24px; font-size: 12px; color: #9CA3AF; }
  </style>
</head>
<body>
  <nav class="nav"><a href="/">Audexon<span>.</span></a><button onclick="I18n.toggleLang()" data-i18n="lang.switchTo" style="margin-inline-start:auto; background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:4px 12px; cursor:pointer; font-family:inherit; font-size:13px;">العربية</button></nav>
  <div class="content">
    <h1>Contact Us</h1>
    <p class="subtitle">Have questions or need support? We're here to help.</p>
    <div class="contact-card">
      <div class="contact-item">
        <div class="contact-label">Email</div>
        <div class="contact-value"><a href="mailto:support@audexon.com">support@audexon.com</a></div>
      </div>
      <div class="contact-item">
        <div class="contact-label">Response Time</div>
        <div class="contact-value">We typically respond within 24 hours</div>
      </div>
    </div>
  </div>
  <div class="footer">Audexon — Built for auditors who move fast.</div>
  <script src="js/i18n.js"></script>
  <script>
    (function(){
      var orig=new WeakMap(), map=null, obs=null, raf=0;
      function run(){ if(!map||!window.I18n) return; var isAr=I18n.getLang()==='ar';
        var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT); var ns=[]; while(w.nextNode())ns.push(w.currentNode);
        ns.forEach(function(n){ var p=n.parentNode; if(!p)return; var t=p.nodeName; if(t==='SCRIPT'||t==='STYLE')return;
          if(p.closest&&p.closest('[data-i18n],[data-i18n-html]'))return;
          if(!orig.has(n))orig.set(n,n.nodeValue); var o=orig.get(n); var k=o.replace(/\s+/g,' ').trim(); if(!k)return;
          var nx=(isAr&&map[k])?o.replace(k,map[k]):o; if(n.nodeValue!==nx)n.nodeValue=nx; }); }
      function sched(){ if(raf)return; raf=requestAnimationFrame(function(){raf=0;run();}); }
      async function setup(){ if(!window.I18n)return; var d=await I18n.dict();
        map=Object.assign({},d.reportLabels||{},d.engagementLabels||{},d.legalText||{}); run();
        obs=new MutationObserver(sched); obs.observe(document.body,{childList:true,subtree:true}); }
      document.addEventListener('i18n:changed',async function(){ var d=await I18n.dict();
        map=Object.assign({},d.reportLabels||{},d.engagementLabels||{},d.legalText||{}); run(); });
      setup();
    })();
  </script>
</body>
</html>
